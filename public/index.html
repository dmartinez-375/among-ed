                                            <input value={uploadName} onChange={e=>setUploadName(e.target.value)} placeholder="Track Name" className="w-full p-2 bg-slate-800 rounded border border-slate-600 text-sm" />
                                            <div className="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label className="block text-[10px] text-slate-500 mb-1">UPLOAD FILE (Max 700KB)</label>
                                                    <input type="file" accept=".mp3,.wav" ref={fileInputRefMusic} onChange={handleMusicUpload} className="block w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500"/>
                                                </div>
                                                <div>
                                                    <label className="block text-[10px] text-slate-500 mb-1">OR PASTE URL</label>
                                                    <div className="flex gap-1">
                                                        <input value={uploadUrl} onChange={e=>setUploadUrl(e.target.value)} placeholder="https://..." className="flex-1 p-1 bg-slate-800 rounded border border-slate-600 text-xs" />
                                                        <button onClick={handleUrlAdd} className="bg-slate-700 px-2 rounded"><PlusCircle size={14}/></button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex-1 overflow-y-auto space-y-2 pr-2">
                                        {musicLibrary.map(t => (
                                            <div key={t.id} className={`flex justify-between items-center p-3 rounded border ${t.id === currentTrack.id ? 'bg-cyan-900/30 border-cyan-500' : 'bg-slate-700 border-slate-600'}`}>
                                                <div className="flex items-center gap-2 overflow-hidden">
                                                    <button
                                                        onClick={() => {
                                                            if (t.id === currentTrack.id) setIsPlaying(p => !p);
                                                            else { pickTrack(t); setIsPlaying(true); }
                                                        }}
                                                        className="p-2 bg-slate-800 rounded-full hover:bg-slate-600"
                                                    >
                                                        {t.id === currentTrack.id && isPlaying ? <Pause size={12}/> : <Play size={12}/>}
                                                    </button>
                                                    <div className="truncate">
                                                        <div className="font-bold text-sm truncate">{t.name}</div>
                                                        <div className="text-[10px] text-slate-400">{t.id === 'default_ambient' ? 'System Default' : 'Custom Track'}</div>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    {t.isDefault ? (
                                                        <span className="text-yellow-400" title="Default Track"><Star size={16} fill="currentColor"/></span>
                                                    ) : (
                                                        <button onClick={() => setTrackAsDefault(t.id)} className="text-slate-500 hover:text-yellow-400" title="Set as Default"><Star size={16}/></button>
                                                    )}
                                                    {t.id !== 'default_ambient' && (
                                                        <button onClick={() => deleteTrack(t.id)} className="text-slate-500 hover:text-red-400"><Trash2 size={16}/></button>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Question Editor Modal */}
                        {showQuestionEditor && (
                            <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-800 w-full max-w-4xl rounded-xl p-6 border border-slate-700 h-[90vh] flex flex-col">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-2xl font-bold text-cyan-400 flex items-center gap-2"><Edit size={24}/> Edit Mission Questions</h2>
                                        <div className="flex gap-2">
                                            <button onClick={addLocalQuestion} className="bg-green-600 px-4 py-2 rounded font-bold flex items-center gap-2 hover:bg-green-500"><PlusCircle size={16}/> Add Question</button>
                                            <button onClick={saveQuestions} className="bg-cyan-600 px-4 py-2 rounded font-bold flex items-center gap-2 hover:bg-cyan-500"><Save size={16}/> Save Changes</button>
                                            <button onClick={() => setShowQuestionEditor(false)} className="bg-slate-700 px-4 py-2 rounded font-bold hover:bg-slate-600">Cancel</button>
                                        </div>
                                    </div>
                                    
                                    <div className="flex-1 overflow-y-auto space-y-4 pr-2">
                                        {localQuestions.map((q, idx) => (
                                            <div key={idx} className="bg-slate-900 p-4 rounded-lg border border-slate-700 relative group">
                                                <button onClick={() => deleteLocalQuestion(idx)} className="absolute top-2 right-2 p-2 text-slate-600 hover:text-red-500 transition-colors"><Trash2 size={18}/></button>
                                                
                                                <div className="mb-3 pr-10">
                                                    <label className="text-xs text-slate-500 uppercase font-bold mb-1 block">Question {idx + 1}</label>
                                                    <input 
                                                        className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-white" 
                                                        value={q.q} 
                                                        onChange={(e) => updateLocalQuestion(idx, 'q', e.target.value)}
                                                        placeholder="Enter question text..."
                                                    />
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                    {q.a.map((ans, aIdx) => (
                                                        <div key={aIdx} className="flex items-center gap-2">
                                                            <input 
                                                                type="radio" 
                                                                name={`correct-${idx}`} 
                                                                checked={q.correct === aIdx} 
                                                                onChange={() => updateLocalQuestion(idx, 'correct', aIdx)}
                                                                className="w-4 h-4 accent-green-500 cursor-pointer"
                                                            />
                                                            <input 
                                                                className={`flex-1 bg-slate-800 border rounded p-2 text-sm ${q.correct === aIdx ? 'border-green-500 text-green-400' : 'border-slate-600 text-slate-300'}`}
                                                                value={ans}
                                                                onChange={(e) => updateLocalQuestion(idx, 'a', e.target.value, aIdx)}
                                                                placeholder={`Option ${aIdx + 1}`}
                                                            />
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                        {localQuestions.length === 0 && (
                                            <div className="text-center py-20 text-slate-600 italic">No questions loaded. Click 'Add Question' to start.</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Cost Config Modal */}
                        {showCostEditor && (
                            <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-800 w-full max-w-lg rounded-xl p-6 border border-slate-700 max-h-[90vh] overflow-y-auto">
                                    <h2 className="text-xl font-bold text-cyan-400 mb-4 flex items-center gap-2"><Sliders size={20}/> Energy Costs Configuration</h2>
                                    
                                    <div className="space-y-6">
                                        <div>
                                            <h3 className="text-sm font-bold text-green-400 uppercase mb-3 border-b border-green-900 pb-1">Crewmate Actions</h3>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label className="text-xs text-slate-400">Note Peek</label><input type="number" className="w-full bg-slate-900 p-2 rounded border border-slate-700" value={config.costs.peek} onChange={e => setConfig({...config, costs: {...config.costs, peek: parseInt(e.target.value) || 0}})} /></div>
                                                <div><label className="text-xs text-slate-400">Private Inv.</label><input type="number" className="w-full bg-slate-900 p-2 rounded border border-slate-700" value={config.costs.private} onChange={e => setConfig({...config, costs: {...config.costs, private: parseInt(e.target.value) || 0}})} /></div>
                                                <div><label className="text-xs text-slate-400">Public Inv.</label><input type="number" className="w-full bg-slate-900 p-2 rounded border border-slate-700" value={config.costs.public} onChange={e => setConfig({...config, costs: {...config.costs, public: parseInt(e.target.value) || 0}})} /></div>
                                                <div><label className="text-xs text-slate-400">Emergency</label><input type="number" className="w-full bg-slate-900 p-2 rounded border border-slate-700" value={config.costs.emergency} onChange={e => setConfig({...config, costs: {...config.costs, emergency: parseInt(e.target.value) || 0}})} /></div>
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="text-sm font-bold text-red-400 uppercase mb-3 border-b border-red-900 pb-1">Imposter Actions</h3>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div><label className="text-xs text-slate-400">Remove Inv.</label><input type="number" className="w-full bg-slate-900 p-2 rounded border border-slate-700" value={config.costs.remove} onChange={e => setConfig({...config, costs: {...config.costs, remove: parseInt(e.target.value) || 0}})} /></div>
                                                <div><label className="text-xs text-slate-400">Fake Scan</label><input type="number" className="w-full bg-slate-900 p-2 rounded border border-slate-700" value={config.costs.fake} onChange={e => setConfig({...config, costs: {...config.costs, fake: parseInt(e.target.value) || 0}})} /></div>
                                                <div><label className="text-xs text-slate-400">Make Unclear</label><input type="number" className="w-full bg-slate-900 p-2 rounded border border-slate-700" value={config.costs.unclear} onChange={e => setConfig({...config, costs: {...config.costs, unclear: parseInt(e.target.value) || 0}})} /></div>
                                                <div><label className="text-xs text-slate-400">Disguise Self</label><input type="number" className="w-full bg-slate-900 p-2 rounded border border-slate-700" value={config.costs.disguise} onChange={e => setConfig({...config, costs: {...config.costs, disguise: parseInt(e.target.value) || 0}})} /></div>
                                            </div>
                                        </div>
                                    </div>

                                    <button onClick={() => setShowCostEditor(false)} className="w-full mt-6 py-3 bg-slate-600 hover:bg-slate-500 rounded font-bold">Save Configuration</button>
                                </div>
                            </div>
                        )}

                        {/* Resume Overlay for Teacher */}
                        {gameState?.phase === 'Ejecting' && <EjectionSequence data={gameState.ejectionData} isPublic={false} isTeacher={true} onResume={resumeGame} />}

                        {/* Question Library Modal */}
                        {libraryOpen && (
                            <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-800 w-full max-w-2xl rounded-xl p-8 border border-slate-700 flex flex-col max-h-[90vh]">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-2xl font-bold flex items-center gap-2"><Library className="text-cyan-400"/> Question Library</h2>
                                        <button onClick={() => setLibraryOpen(false)} className="p-2 bg-slate-700 rounded-full"><XCircle /></button>
                                    </div>
                                    <div className="flex gap-2 mb-4">
                                        <button onClick={() => setImportMode(false)} className={`flex-1 py-2 rounded font-bold ${!importMode ? 'bg-cyan-600 text-white' : 'bg-slate-700 text-slate-400'}`}>Saved Sets</button>
                                        <button onClick={() => setImportMode(true)} className={`flex-1 py-2 rounded font-bold ${importMode ? 'bg-cyan-600 text-white' : 'bg-slate-700 text-slate-400'}`}>Import New</button>
                                    </div>
                                    {!importMode && (
                                        <div className="flex-1 overflow-y-auto space-y-2 pr-2">
                                            <div className="bg-slate-900 p-3 rounded border border-slate-700 mb-4">
                                                <div className="text-sm text-slate-400 uppercase">Active Set</div>
                                                <div className="font-bold text-xl text-cyan-400">{gameState?.questions?.length || DEFAULT_QUESTIONS.length} Questions Loaded</div>
                                            </div>
                                            {questionSets.map(qs => (
                                                <div key={qs.id} className="flex justify-between items-center bg-slate-700 p-4 rounded border border-slate-600">
                                                    <div><div className="font-bold text-lg">{qs.name}</div><div className="text-sm text-slate-300">{qs.questions.length} Questions</div></div>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => loadQuestionSet(qs)} className="px-4 py-2 bg-green-600 hover:bg-green-500 rounded font-bold flex items-center gap-2"><Play size={16} /> LOAD</button>
                                                        <button onClick={() => deleteQuestionSet(qs.id)} className="p-2 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded"><Trash2 size={18} /></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    {importMode && (
                                        <div className="space-y-6">
                                            <div className="p-4 bg-slate-900 rounded border border-slate-700">
                                                <h3 className="font-bold text-slate-200 mb-2">1. Get Template</h3>
                                                <button onClick={downloadTemplate} className="flex items-center gap-2 text-sm bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded text-white"><Download size={14} /> Download CSV</button>
                                            </div>
                                            <div className="p-4 bg-slate-900 rounded border border-slate-700">
                                                <h3 className="font-bold text-slate-200 mb-2">2. Upload</h3>
                                                <div className="space-y-3">
                                                    <input type="text" value={newSetName} onChange={(e) => setNewSetName(e.target.value)} placeholder="Set Name" className="w-full p-2 bg-slate-800 rounded border border-slate-600" />
                                                    <input type="file" accept=".csv" ref={fileInputRef} onChange={handleFileUpload} className="block w-full text-sm text-slate-400" />
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {showStats && (
                            <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-800 w-full max-w-2xl rounded-xl p-6 max-h-[90vh] flex flex-col">
                                    <h2 className="text-2xl font-bold mb-4">Mission Report</h2>
                                    <div className="flex-1 overflow-y-auto space-y-2 mb-6">
                                        {Object.values(players).map(p => (
                                            <div key={p.id} className="flex justify-between bg-slate-700 p-3 rounded">
                                                <span>{p.name}</span>
                                                <div className="flex gap-4">
                                                    <span className="text-green-400">Correct: {stats[p.id]?.correct ?? 0}</span>
                                                    <span className="text-red-400">Wrong: {stats[p.id]?.incorrect ?? 0}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex gap-4">
                                        <button onClick={confirmReset} className="flex-1 py-3 bg-red-600 hover:bg-red-500 rounded font-bold">Confirm Reset</button>
                                        <button onClick={() => setShowStats(false)} className="flex-1 py-3 bg-slate-600 hover:bg-slate-500 rounded font-bold">Cancel</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- Student Interface ---
        function StudentInterface({ user, userName, db, classId }) {
            const pId = userName.toLowerCase().trim();
            const [gameState, setGameState] = useState(null);
            const [me, setMe] = useState(null);
            const [players, setPlayers] = useState({});
            const [menuOpen, setMenuOpen] = useState(false);
            const [noteOpen, setNoteOpen] = useState(false);
            const [notes, setNotes] = useState("");
            
            const hasLoadedOnce = useRef(false);
            const prevStatusRef = useRef(null);

            // COST FIX: own counters come from the stats doc; answers are tallied locally and flushed in bulk
            const [myStats, setMyStats] = useState(null);
            const [playersReady, setPlayersReady] = useState(false);
            const pendingRef = useRef({ energy: 0, correct: 0, incorrect: 0 });
            const [pendingEnergy, setPendingEnergy] = useState(0); // display only
            const noteOpenRef = useRef(false);
            const removedRef = useRef(false); // set if the teacher removed us; stops heartbeats/flushes
            noteOpenRef.current = noteOpen;

            // FIX #10: estimate (server time - device time) so cooldowns don't depend on the device clock.
            const [serverOffset, setServerOffset] = useState(0);
            const offsetSetRef = useRef(false);
            const nonceRef = useRef(Math.random().toString(36).slice(2));
            
            // Question Engine State
            const [qIndex, setQIndex] = useState(0);
            const [questionQueue, setQuestionQueue] = useState([]);
            
            // Feedback State
            const [feedback, setFeedback] = useState(null); 

            const [viewingNote, setViewingNote] = useState(null);
            const [showIntro, setShowIntro] = useState(false);

            // Paths specific to the selected class
            const paths = useMemo(() => getPaths(classId), [classId]);

            useEffect(() => {
                const init = async () => {
                    try {
                        const ref = getPlayerRef(db, paths, pId);
                        const s = await getDoc(ref);
                        
                        if (!s.exists()) {
                            // Late joiners during an active game become Crewmates
                            const gameSnap = await getDoc(getGameRef(db, paths));
                            const initialRole = (gameSnap.exists() && gameSnap.data().status === 'Active') ? 'Crewmate' : 'Pending';
                            
                            await setDoc(ref, { 
                                name: userName, 
                                role: initialRole,
                                isAlive: true, votes: 0, hasVoted: false, investigatedStatus: 'Normal',
                                joinNonce: nonceRef.current,
                                lastSeen: serverTimestamp()
                            });
                        } else {
                            // Re-joining: keep all game state, just refresh name + server-clock probe
                            await updateDoc(ref, { name: userName, joinNonce: nonceRef.current, lastSeen: serverTimestamp() });
                        }

                        // Counters live in their own doc (also migrates legacy values from the player doc)
                        const sRef = getStatsRef(db, paths, pId);
                        const st = await getDoc(sRef);
                        if (!st.exists()) {
                            const old = s.exists() ? s.data() : {};
                            await setDoc(sRef, {
                                energy: old.energy || 0, correct: old.correct || 0,
                                incorrect: old.incorrect || 0, notes: old.notes || '',
                                lastSeen: serverTimestamp()
                            });
                        } else {
                            await updateDoc(sRef, { lastSeen: serverTimestamp() });
                        }
                    } catch (e) { console.error("Join failed", e); }
                };
                init();

                const unsubG = onSnapshot(getGameRef(db, paths), (s) => {
                    const data = s.data();
                    if (data?.status === 'Active' && prevStatusRef.current === 'Lobby') setShowIntro(true);
                    if (data?.status === 'Lobby') { pendingRef.current = { energy: 0, correct: 0, incorrect: 0 }; setPendingEnergy(0); }
                    prevStatusRef.current = data?.status;
                    setGameState(data);
                });
                const unsubP = onSnapshot(getPlayerRef(db, paths, pId), (s) => {
                    if (s.exists()) {
                        hasLoadedOnce.current = true;
                        const d = s.data();
                        setMe(d);

                        // Only trust a lastSeen written by THIS session and confirmed by the server
                        if (!offsetSetRef.current && d.joinNonce === nonceRef.current && d.lastSeen?.seconds && !s.metadata.hasPendingWrites) {
                            offsetSetRef.current = true;
                            setServerOffset(d.lastSeen.seconds * 1000 - Date.now());
                        }
                    } else {
                        if (hasLoadedOnce.current) {
                            removedRef.current = true;
                            alert("You have been removed from the mission.");
                            window.location.reload();
                        }
                    }
                });
                const unsubS = onSnapshot(getStatsRef(db, paths, pId), (s) => {
                    if (!s.exists()) return;
                    const d = s.data();
                    setMyStats(d);
                    // Don't clobber text the student is typing
                    if (!noteOpenRef.current) setNotes(d.notes || '');
                });
                return () => { unsubG(); unsubP(); unsubS(); };
            }, [paths, pId]);

            // --- COST FIX: debounced stat writes ---
            const flushPending = async () => {
                if (removedRef.current) return;
                const p = pendingRef.current;
                if (!p.energy && !p.correct && !p.incorrect) return;
                pendingRef.current = { energy: 0, correct: 0, incorrect: 0 };
                setPendingEnergy(0);
                try {
                    await setDoc(getStatsRef(db, paths, pId), {
                        energy: increment(p.energy), correct: increment(p.correct), incorrect: increment(p.incorrect),
                        lastSeen: serverTimestamp()
                    }, { merge: true });
                } catch (e) {
                    console.error("Stat sync failed, will retry", e);
                    const q = pendingRef.current;
                    pendingRef.current = { energy: q.energy + p.energy, correct: q.correct + p.correct, incorrect: q.incorrect + p.incorrect };
                    setPendingEnergy(pendingRef.current.energy);
                }
            };
            const flushRef = useRef(flushPending);
            flushRef.current = flushPending;

            useEffect(() => {
                const id = setInterval(() => flushRef.current(), 5000);

                // Heartbeat: lets the teacher tell who is actually here (only while the tab is visible)
                const beat = () => {
                    if (removedRef.current || document.visibilityState !== 'visible') return;
                    setDoc(getStatsRef(db, paths, pId), { lastSeen: serverTimestamp() }, { merge: true }).catch(() => {});
                };
                const beatId = setInterval(beat, HEARTBEAT_MS);

                const onHide = () => { if (document.visibilityState === 'hidden') flushRef.current(); else beat(); };
                const onLeave = () => flushRef.current();
                document.addEventListener('visibilitychange', onHide);
                window.addEventListener('pagehide', onLeave);
                window.addEventListener('beforeunload', onLeave);
                return () => {
                    clearInterval(id);
                    clearInterval(beatId);
                    document.removeEventListener('visibilitychange', onHide);
                    window.removeEventListener('pagehide', onLeave);
                    window.removeEventListener('beforeunload', onLeave);
                    flushRef.current();
                };
            }, []);

            // --- COST FIX: the players collection is only read when a screen needs it ---
            // Lobby: live (so join chips update). Meeting / Mission Control / Win screen: one-time fetch,
            // since names and alive-status don't change while those screens are open.
            const needLive = gameState?.status === 'Lobby';
            const needFetch = !needLive && !!gameState && (gameState.phase === 'Meeting' || menuOpen || !!gameState.winner);

            useEffect(() => {
                if (!needLive) return;
                const unsub = onSnapshot(collection(db, ...paths.games, GAME_ID, 'players'), (s) => {
                    const all = {}; s.forEach(d => all[d.id] = {id: d.id, ...d.data()});
                    setPlayers(all);
                    setPlayersReady(true);
                });
                return () => { unsub(); setPlayersReady(false); };
            }, [needLive, paths]);

            useEffect(() => {
                if (!needFetch) return;
                let cancelled = false;
                getDocs(collection(db, ...paths.games, GAME_ID, 'players')).then((s) => {
                    if (cancelled) return;
                    const all = {}; s.forEach(d => all[d.id] = {id: d.id, ...d.data()});
                    setPlayers(all);
                    setPlayersReady(true);
                }).catch(e => console.error("Could not load crew list", e));
                return () => { cancelled = true; setPlayersReady(false); };
            }, [needFetch, paths]);

            // --- Question Randomization Logic ---
            const questionsKey = JSON.stringify(gameState?.questions);

            // 1. Reset Queue if Teacher loads a completely new Question Set
            useEffect(() => {
                setQuestionQueue([]);
                setQIndex(0);
                setFeedback(null);
            }, [questionsKey]); 

            // 2. Queue Management (Refill with shuffled indices when running low)
            useEffect(() => {
                if (!gameState) return;
                const qs = gameState.questions || DEFAULT_QUESTIONS;
                
                if (questionQueue.length <= qIndex + 2) {
                    const indices = Array.from({length: qs.length}, (_, i) => i);
                    for (let i = indices.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [indices[i], indices[j]] = [indices[j], indices[i]];
                    }
                    setQuestionQueue(prev => [...prev, ...indices]);
                }
            }, [qIndex, questionQueue.length, gameState]);

            // 3. Derive Current Question Data (Random Q + Scrambled Answers)
            // Depends on the raw index (not the whole queue) so a queue refill doesn't re-scramble the question on screen.
            const rawIndex = questionQueue[qIndex];
            const currentQData = useMemo(() => {
                if (!gameState) return null;
                const qs = gameState.questions || DEFAULT_QUESTIONS;
                
                if (rawIndex === undefined) return null;
                
                const safeQ = qs[rawIndex] || qs[0];

                const options = safeQ.a.map((text, idx) => ({ text, originalIndex: idx }));
                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }

                return { 
                    q: safeQ.q, 
                    shuffledOptions: options, 
                    rawCorrectIndex: safeQ.correct 
                };
            }, [qIndex, rawIndex, questionsKey]);

            const handleAns = async (selectedOption) => {
                if (!currentQData || feedback) return;
                const correct = selectedOption.originalIndex === currentQData.rawCorrectIndex;
                
                // Tally locally; flushPending() syncs every few seconds and before any spend
                const p = pendingRef.current;
                if (correct) { p.energy += 1; p.correct += 1; }
                else {
                    if ((myStats?.energy || 0) + p.energy > 0) p.energy -= 1;
                    p.incorrect += 1;
                }
                setPendingEnergy(p.energy);

                setFeedback({
                    isCorrect: correct,
                    selectedOption: selectedOption,
                    correctOriginalIndex: currentQData.rawCorrectIndex
                });

                if (correct) {
                    setTimeout(() => {
                        setQIndex(i => i + 1);
                        setFeedback(null);
                    }, 1200);
                }
            };

            const nextMission = () => {
                setQIndex(i => i + 1);
                setFeedback(null);
            };

            // FIX #1: 'skip' is tallied on the game doc (there is no player doc called 'skip')
            const voteFor = async (targetId) => {
                if (me.hasVoted || !me.isAlive) return;
                try {
                    const batch = writeBatch(db);
                    batch.update(getPlayerRef(db, paths, pId), { hasVoted: true });
                    if (targetId === 'skip') batch.update(getGameRef(db, paths), { skipVotes: increment(1) });
                    else batch.update(getPlayerRef(db, paths, targetId), { votes: increment(1) });
                    await batch.commit();
                } catch (e) {
                    alert("Vote failed, please try again: " + e.message);
                }
            };

            if (!gameState || !me) return <div className="min-h-screen bg-slate-900 text-white p-10">Syncing...</div>;

            const displayEnergy = (myStats?.energy || 0) + pendingEnergy;

            // Win Screens
            if (gameState.winner) return <WinScreen winner={gameState.winner} players={players} />;
            if (gameState.phase === 'Ejecting') return <EjectionSequence data={gameState.ejectionData} isPublic={false} isTeacher={false} />;
            
            if (gameState.status === 'Lobby') return (
                <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center">
                    <div className="text-6xl mb-4">🚀</div>
                    <h2 className="text-2xl font-bold">Waiting for Launch...</h2>
                    <div className="mt-8 flex flex-wrap gap-2 justify-center max-w-md">
                        {Object.values(players).map(p => <span key={p.id} className="px-3 py-1 bg-slate-800 rounded-full text-xs">{p.name}</span>)}
                    </div>
                </div>
            );

            if (showIntro) return <IntroSequence role={me.role} onClose={() => setShowIntro(false)} />;

            if (gameState.phase === 'Meeting') return (
                <div className="min-h-screen bg-slate-900 text-white flex flex-col p-6">
                    <div className="text-center mb-6">
                        <AlertTriangle size={48} className="text-red-500 mx-auto mb-2 animate-bounce" />
                        <h1 className="text-2xl font-bold text-red-500 uppercase">Emergency Meeting</h1>
                        <p className="text-slate-400">{me.isAlive ? (me.hasVoted ? "Vote Cast. Waiting..." : "Vote for an Imposter") : "You are dead."}</p>
                    </div>
                    {me.isAlive && !me.hasVoted && !playersReady && (
                        <p className="text-center text-slate-500 animate-pulse">Loading crew list...</p>
                    )}
                    {me.isAlive && !me.hasVoted && playersReady && (
                        <div className="grid grid-cols-2 gap-3">
                            {Object.values(players).filter(p => p.isAlive && p.id !== pId).map(p => (
                                <button key={p.id} onClick={() => voteFor(p.id)} className="p-4 bg-slate-800 border border-slate-600 rounded-xl font-bold hover:bg-red-900 hover:border-red-500 transition-all">
                                    {p.name}
                                </button>
                            ))}
                            <button onClick={() => voteFor('skip')} className="col-span-2 p-3 bg-slate-700 rounded-xl text-slate-300 font-bold">Skip Vote</button>
                        </div>
                    )}
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-900 text-white flex flex-col relative overflow-hidden">
                    <div className="bg-slate-800 p-3 flex justify-between items-center border-b border-slate-700 relative z-20">
                        <div className="absolute left-1/2 -translate-x-1/2 font-bold text-cyan-400">{me.name}</div>
                        <div className="w-8"></div> 
                        <button onClick={() => setNoteOpen(true)} className="bg-slate-700 p-2 rounded relative">
                            <FileText size={20} />
                            {myStats?.notes && <span className="absolute top-0 right-0 w-2 h-2 bg-green-500 rounded-full"></span>}
                        </button>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center p-4 relative z-10">
                        {feedback?.isCorrect && (
                            <div className="absolute right-0 top-20 z-30 animate-fade-in pointer-events-none">
                                <div className="bg-green-600 text-white font-black uppercase text-xl py-2 px-6 rounded-l-xl shadow-lg border-2 border-green-400">
                                    Correct!
                                </div>
                            </div>
                        )}

                        {!me.isAlive && (
                            <div className="bg-red-900/50 border border-red-500 p-4 rounded-lg mb-6 text-center w-full max-w-md">
                                <h3 className="font-bold flex items-center justify-center gap-2"><Ghost/> Ghost Mode</h3>
                                <p className="text-xs text-red-200">Earn energy to donate!</p>
                            </div>
                        )}

                        <div className="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700">
                            {currentQData ? (
                                <>
                                    <h3 className="text-xl font-medium mb-6 text-center">{currentQData.q}</h3>
                                    <div className="grid grid-cols-1 gap-3">
                                        {currentQData.shuffledOptions.map((opt, i) => {
                                            let btnClass = `p-4 rounded-xl font-bold text-left transition-transform active:scale-95 text-white ${BTN_COLORS[i % BTN_COLORS.length]}`;
                                            
                                            if (feedback) {
                                                const isThisCorrect = opt.originalIndex === feedback.correctOriginalIndex;
                                                const isThisSelected = opt.originalIndex === feedback.selectedOption.originalIndex;
                                                
                                                if (isThisCorrect) {
                                                    btnClass = "p-4 rounded-xl font-bold text-left text-white bg-slate-800 border-4 border-green-500 shadow-[0_0_15px_rgba(34,197,94,0.5)]";
                                                } else if (isThisSelected && !feedback.isCorrect) {
                                                    btnClass = "p-4 rounded-xl font-bold text-left text-white bg-slate-800 border-4 border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.5)]";
                                                } else {
                                                    btnClass = "p-4 rounded-xl font-bold text-left text-slate-500 bg-slate-900 opacity-50";
                                                }
                                            }

                                            return (
                                                <button disabled={!!feedback} key={i} onClick={() => handleAns(opt)} className={btnClass}>
                                                    {opt.text}
                                                </button>
                                            );
                                        })}
                                    </div>
                                    {feedback && !feedback.isCorrect && (
                                        <button onClick={nextMission} className="w-full mt-6 py-3 bg-cyan-600 hover:bg-cyan-500 rounded-xl font-bold text-white animate-bounce">
                                            Next Mission →
                                        </button>
                                    )}
                                </>
                            ) : (
                                <div className="text-center py-10 animate-pulse text-slate-400">Loading Mission Data...</div>
                            )}
                        </div>
                    </div>

                    <div className="bg-slate-800 p-4 flex justify-between items-center border-t border-slate-700 relative z-20">
                        <div>
                            <span className="text-[10px] uppercase text-slate-400 tracking-widest">Energy</span>
                            <div className="text-3xl font-mono font-bold text-yellow-400 flex items-center gap-1"><Zap fill="currentColor"/> {displayEnergy}</div>
                        </div>
                        <button onClick={() => setMenuOpen(true)} className="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-xl font-bold flex items-center gap-2 shadow-lg">
                            <Settings size={20} /> Mission Control
                        </button>
                    </div>

                    {menuOpen && <MissionControl 
                        role={me.role} energy={displayEnergy} me={me} 
                        pId={pId} 
                        players={players} 
                        config={gameState.config} 
                        gameState={gameState} 
                        db={db} 
                        classId={classId}
                        serverOffset={serverOffset} flushPending={flushPending} playersReady={playersReady} close={() => setMenuOpen(false)} 
                        setNote={setViewingNote} 
                    />}
                    
                    {noteOpen && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-800 w-full max-w-lg rounded-xl p-6">
                                <div className="flex justify-between mb-4"><h2 className="font-bold flex gap-2"><FileText/> Log</h2><button onClick={()=>{setDoc(getStatsRef(db, paths, pId), {notes}, {merge: true}); setNoteOpen(false)}}><XCircle/></button></div>
                                <textarea value={notes} onChange={e=>setNotes(e.target.value)} className="w-full h-40 bg-slate-900 rounded p-3 text-white" placeholder="Suspicions..." />
                            </div>
                        </div>
                    )}

                    {viewingNote && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-slate-800 w-full max-w-md rounded-xl p-6 border border-cyan-500">
                                <h2 className="font-bold mb-4 text-cyan-400">Decrypted Note</h2>
                                <div className="bg-slate-900 p-4 rounded italic">"{viewingNote}"</div>
                                <button onClick={() => setViewingNote(null)} className="w-full mt-4 bg-slate-700 py-2 rounded">Close</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Mission Control ---
        function MissionControl({ role, energy, me, pId, players, config, gameState, db, classId, serverOffset, flushPending, playersReady, close, setNote }) {
            const [msg, setMsg] = useState("");
            const [mode, setMode] = useState(null); 
            
            // Generate paths
            const paths = useMemo(() => getPaths(classId), [classId]);

            const flash = (text, ms = 2000) => {
                setMsg(text);
                setTimeout(() => setMsg(""), ms);
            };

            // Atomic energy payment (FIX #9/#10: no more double-tap overspend).
            // invDelta !== 0 also adjusts the shared investigation pool in the same transaction,
            // refusing (and not charging) when the pool is already empty. The pool never goes below 0.
            const spend = async (cost, invDelta = 0) => {
                await flushPending(); // make sure locally-tallied energy is on the server first
                const pRef = getStatsRef(db, paths, pId); // energy lives in the stats doc
                const gRef = getGameRef(db, paths);
                try {
                    const result = await runTransaction(db, async (tx) => {
                        const ps = await tx.get(pRef);
                        const gs = invDelta !== 0 ? await tx.get(gRef) : null;

                        const cur = ps.exists() ? (ps.data().energy || 0) : 0;
                        if (cur < cost) return 'energy';

                        if (invDelta !== 0) {
                            const left = gs.data()?.config?.investigationsLeft ?? 0;
                            if (left <= 0) return 'empty';
                            tx.update(gRef, { 'config.investigationsLeft': Math.max(0, left + invDelta) });
                        }
                        tx.set(pRef, { energy: cur - cost }, { merge: true });
                        return 'ok';
                    });

                    if (result === 'energy') { flash("Not enough energy!"); return false; }
                    if (result === 'empty') { flash("No investigations left!"); return false; }
                    return true;
                } catch (e) {
                    flash("Error: " + e.message, 3000);
                    return false;
                }
            };

            // --- INVESTIGATION LOGIC ---
            const getInvestigationResult = (target) => {
                const isDisguised = target.investigatedStatus === 'Disguised';
                const isSabotaged = target.investigatedStatus === 'Unclear';
                const isImposter = target.role === 'Imposter';
                const rng = Math.random(); // 0.0 to 1.0

                // 1. Disguise overrides everything (Imposter looks innocent)
                if (isDisguised) return "All Clear";

                // 2. Sabotage overrides remaining logic (Crew looks suspicious)
                if (isSabotaged) return "Inconclusive";

                // 3. 33% Global Chance of "Inconclusive" for anyone
                if (rng < 0.33) return "Inconclusive";

                // 4. Role based results
                if (isImposter) return "Inconclusive";
                
                // 5. Default Crewmate
                return "All Clear";
            };

            // --- ACTION HANDLER ---
            const handleTargetAction = async (targetId) => {
                const target = players[targetId];
                if (!target) return;

                if (mode === 'peek') {
                    if (!(await spend(config.costs.peek))) return;
                    // Notes live in the target's stats doc; fetch just that one doc on demand
                    let noteText = "This notebook is empty.";
                    try {
                        const ns = await getDoc(getStatsRef(db, paths, targetId));
                        noteText = ns.data()?.notes || noteText;
                    } catch (e) { console.error(e); }
                    setNote(noteText);
                    close();
                }
                else if (mode === 'private') {
                    if (!(await spend(config.costs.private))) return;
                    
                    const result = getInvestigationResult(target);

                    // Reset target status after check
                    if (target.investigatedStatus !== 'Normal') {
                        await updateDoc(getPlayerRef(db, paths, targetId), { investigatedStatus: 'Normal' });
                    }

                    alert(`INVESTIGATION RESULT:\n\nSubject: ${target.name}\nResult: ${result}`);
                    close();
                }
                else if (mode === 'public') {
                    // FIX #9: pays and consumes one investigation atomically; refuses when none are left
                    if (!(await spend(config.costs.public, -1))) return;

                    const result = getInvestigationResult(target);

                    if (target.investigatedStatus !== 'Normal') {
                        await updateDoc(getPlayerRef(db, paths, targetId), { investigatedStatus: 'Normal' });
                    }

                    await addDoc(collection(db, ...paths.games, GAME_ID, 'feed'), {
                        message: `${me.name} investigated ${target.name}. Result: ${result}`,
                        source: "Investigation Terminal",
                        timestamp: serverTimestamp()
                    });

                    close();
                }
                else if (mode === 'unclear') {
                     if (!(await spend(config.costs.unclear))) return;
                     await updateDoc(getPlayerRef(db, paths, targetId), { investigatedStatus: 'Unclear' });
                     setMsg(`Sabotaged ${target.name}'s ID!`);
                     setTimeout(close, 1000);
                }
                else if (mode === 'fake') {
                    if (!(await spend(config.costs.fake))) return;
                    
                    await addDoc(collection(db, ...paths.games, GAME_ID, 'feed'), {
                        message: `${me.name} investigated ${target.name}. Result: All Clear`, // Always fake clear
                        source: "Investigation Terminal",
                        timestamp: serverTimestamp()
                    });
                    
                    setMsg("Fake log generated.");
                    setTimeout(close, 1000);
                }
            };

            // FIX #10: only during normal play, cooldown measured on (approximate) server time,
            // and the phase flip + energy charge happen in one transaction so two students
            // can't both trigger a meeting.
            const triggerMeeting = async () => {
                if (gameState.winner || gameState.phase !== 'Game') {
                    flash("A meeting can't be called right now.", 3000);
                    return;
                }

                const serverNow = (Date.now() + (serverOffset || 0)) / 1000;
                const lastEnd = gameState.lastMeetingEnded ? gameState.lastMeetingEnded.seconds : 0;
                const cooldown = config.meetingCooldown ?? 120;
                const remaining = cooldown - (serverNow - lastEnd);
                if (lastEnd && remaining > 0) {
                    flash(`Systems cooling down... Wait ${Math.ceil(remaining)}s`, 3000);
                    return;
                }

                await flushPending();
                const pRef = getStatsRef(db, paths, pId); // energy lives in the stats doc
                const gRef = getGameRef(db, paths);
                const feedDoc = doc(collection(db, ...paths.games, GAME_ID, 'feed'));
                const cost = config.costs.emergency;

                try {
                    const result = await runTransaction(db, async (tx) => {
                        const gs = await tx.get(gRef);
                        const ps = await tx.get(pRef);
                        const g = gs.data();
                        if (!g || g.phase !== 'Game' || g.winner) return 'phase';
                        const cur = ps.exists() ? (ps.data().energy || 0) : 0;
                        if (cur < cost) return 'energy';

                        tx.set(pRef, { energy: cur - cost }, { merge: true });
                        tx.update(gRef, { phase: 'Meeting', skipVotes: 0 });
                        tx.set(feedDoc, {
                            message: `🚨 EMERGENCY MEETING CALLED BY ${me.name.toUpperCase()}!`,
                            source: "System Alert",
                            timestamp: serverTimestamp()
                        });
                        return 'ok';
                    });

                    if (result === 'energy') return flash("Not enough energy!");
                    if (result === 'phase') return flash("A meeting can't be called right now.", 3000);
                    close();
                } catch (e) {
                    flash("Error: " + e.message, 3000);
                }
            };

            // --- GHOST ACTIONS ---
            const donateEnergy = async (targetRole) => {
                if (!playersReady) { flash("Scanning crew... try again in a second."); return; }

                const potentialTargets = Object.values(players).filter(p => 
                    p.isAlive && p.role === targetRole && p.id !== pId
                );
                if (potentialTargets.length === 0) {
                    setMsg("No alive teammates found!");
                    return;
                }

                await flushPending();
                const recipient = potentialTargets[Math.floor(Math.random() * potentialTargets.length)];
                const meRef = getStatsRef(db, paths, pId);
                const recRef = getStatsRef(db, paths, recipient.id);

                try {
                    // Donate ALL energy, atomically
                    const amount = await runTransaction(db, async (tx) => {
                        const ms = await tx.get(meRef);
                        const amt = ms.exists() ? (ms.data().energy || 0) : 0;
                        if (amt < 1) return 0;
                        tx.update(meRef, { energy: 0 });
                        tx.set(recRef, { energy: increment(amt) }, { merge: true });
                        return amt;
                    });
                    if (!amount) { setMsg("Need energy to donate!"); return; }
                    setMsg(`Donated ${amount}⚡ to ${recipient.name}`);
                    setTimeout(close, 1500);
                } catch (e) {
                    flash("Error: " + e.message, 3000);
                }
            };

            // IMPOSTER ACTIONS (Instant)
            const doRemove = async () => {
                // FIX #9: clamps at 0 and won't charge if the pool is already empty
                if (!(await spend(config.costs.remove, -config.removeAmount))) return;
                setMsg("Records deleted...");
                setTimeout(close, 1000);
            };

            const doDisguise = async () => {
                if (!(await spend(config.costs.disguise))) return;
                await updateDoc(getPlayerRef(db, paths, pId), { investigatedStatus: 'Disguised' });
                setMsg("Disguise active (1 Use)");
                setTimeout(close, 1000);
            };

            return (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-end sm:items-center justify-center sm:p-4">
                    <div className="bg-slate-900 w-full max-w-lg sm:rounded-2xl border-t sm:border border-slate-700 p-6 slide-up-anim max-h-[90vh] flex flex-col">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-black uppercase text-cyan-400">
                                {mode ? <button onClick={() => setMode(null)} className="text-sm mr-2 text-slate-400 hover:text-white">← BACK</button> : null}
                                Mission Control
                            </h2>
                            <button onClick={close}><XCircle /></button>
                        </div>
                        
                        {msg && <div className="mb-4 p-2 bg-red-500 text-white text-center rounded animate-pulse">{msg}</div>}
                        
                        {/* MODE: MAIN MENU */}
                        {!mode && (
                            <div className="grid grid-cols-2 gap-3 overflow-y-auto">
                                {!me.isAlive ? (
                                    <>
                                        <div className="col-span-2 text-center text-slate-500 italic mb-2">Ghost Uplink Established</div>
                                        <ActionBtn icon={Zap} title="Donate to Crew" desc="Send energy to alive Crew." cost="ALL" fullDesc="Transfers all your collected energy to a random Crewmate." onClick={() => donateEnergy('Crewmate')} color="cyan" />
                                        <ActionBtn icon={Zap} title="Donate to Imposter" desc="Send energy to alive Imposters." cost="ALL" fullDesc="Transfers all your collected energy to a random Imposter." onClick={() => donateEnergy('Imposter')} color="red" />
                                    </>
                                ) : (
                                    /* ALIVE PLAYERS MENU */
                                    role === 'Crewmate' ? (
                                        <>
                                            <ActionBtn icon={Eye} title="Note Peek" desc="Check a player's notes." cost={config.costs.peek} fullDesc="Select a player to read their notebook." onClick={() => setMode('peek')} />
                                            <ActionBtn icon={Lock} title="Private Inv." desc="Investigate privately." cost={config.costs.private} fullDesc="Check if a player is 'All Clear' or 'Inconclusive'. Only you see the result." onClick={() => setMode('private')} />
                                            <ActionBtn icon={Radio} title="Public Inv." desc="Investigate & Broadcast." cost={config.costs.public} fullDesc="Check a player and post the result to the Public Feed." onClick={() => setMode('public')} />
                                            <ActionBtn icon={AlertTriangle} title="Emergency" desc="Call a meeting!" cost={config.costs.emergency} fullDesc="Stop the game to vote someone out." onClick={triggerMeeting} color="red" />
                                        </>
                                    ) : (
                                        <>
                                            <ActionBtn icon={UserX} title="Inv. Remover" desc="Remove crew investigations!" cost={config.costs.remove} fullDesc={`Remove ${config.removeAmount} investigations from the total pool.`} onClick={doRemove} />
                                            <ActionBtn icon={FileText} title="Fake Inv." desc="Create fake public log." cost={config.costs.fake} fullDesc="Select a player to generate a fake 'All Clear' report on the public feed." onClick={() => setMode('fake')} />
                                            <ActionBtn icon={Unlock} title="Unclear" desc="Make crew look guilty!" cost={config.costs.unclear} fullDesc="Target player will return 'Inconclusive' instead of 'All Clear'." onClick={() => setMode('unclear')} />
                                            <ActionBtn icon={Shield} title="Disguise" desc="Look innocent once." cost={config.costs.disguise} fullDesc="You will show up as 'All Clear' the next time you are investigated." onClick={doDisguise} />
                                        </>
                                    )
                                )}
                            </div>
                        )}

                        {/* MODE: PLAYER SELECTION */}
                        {mode && ['peek', 'private', 'public', 'unclear', 'fake'].includes(mode) && (
                            <div className="flex-1 overflow-y-auto">
                                <h3 className="text-slate-400 mb-2 uppercase text-xs font-bold">Select Target:</h3>
                                <div className="space-y-2">
                                    {playersReady && Object.values(players).filter(p => p.id !== pId && p.isAlive).map(p => (
                                        <button 
                                            key={p.id} 
                                            onClick={() => handleTargetAction(p.id)}
                                            className="w-full text-left p-3 bg-slate-800 hover:bg-cyan-900 rounded border border-slate-700 flex justify-between items-center"
                                        >
                                            <span className="font-bold">{p.name}</span>
                                            <span className="text-xs text-slate-500">Select</span>
                                        </button>
                                    ))}
                                    {!playersReady && <div className="text-slate-500 italic text-center py-4 animate-pulse">Scanning crew...</div>}
                                    {playersReady && Object.values(players).filter(p => p.id !== pId && p.isAlive).length === 0 && (
                                        <div className="text-slate-500 italic text-center py-4">No viable targets found.</div>
                                    )}
                                </div>
                            </div>
                        )}

                        <div className="mt-4 pt-4 border-t border-slate-700 text-center text-xs text-slate-500 flex justify-between items-center">
                            <span>CURRENT ENERGY: <span className="text-yellow-400 font-bold">{energy}</span></span>
                            {mode && <span className="uppercase text-cyan-400">{mode} MODE</span>}
                        </div>
                    </div>
                </div>
            );
        }

        function ActionBtn({ icon: Icon, title, desc, fullDesc, cost, onClick, color = 'cyan' }) {
            const [showHelp, setShowHelp] = useState(false);
            if (showHelp) return (
                <div onClick={() => setShowHelp(false)} className="col-span-1 p-4 rounded-lg border bg-slate-800 cursor-pointer border-slate-600 flex flex-col items-center text-center justify-center min-h-[120px]">
                    <p className="text-sm text-slate-300">{fullDesc}</p>
                    <p className="text-[10px] text-slate-500 mt-2">(Click to return)</p>
                </div>
            );
            return (
                <div className="relative p-3 rounded-lg border border-cyan-900/50 hover:bg-cyan-900/20 flex flex-col items-center text-center transition-all group bg-slate-800/50">
                    <button onClick={(e) => { e.stopPropagation(); setShowHelp(true); }} className="absolute top-1 right-1 text-slate-600 hover:text-white"><HelpCircle size={14}/></button>
                    <div onClick={onClick} className="cursor-pointer w-full flex flex-col items-center">
                        <Icon className={`w-8 h-8 mb-1 text-cyan-400`} />
                        <span className="font-bold text-white text-sm">{title}</span>
                        <span className="text-[10px] text-slate-400 leading-tight my-1">{desc}</span>
                        <span className="text-xs text-yellow-500 font-mono font-bold">{cost} Energy</span>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
