<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Ed - Multiverse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }

        .slide-up-anim { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .fade-in { animation: fadeIn 1s ease-in forwards; }
        .animate-fade-in { animation: fadeIn 0.6s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .drama-text { animation: dramaScale 3s ease-out forwards; }
        @keyframes dramaScale { 
            0% { transform: scale(0.8); opacity: 0; } 
            20% { transform: scale(1); opacity: 1; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Range Slider Styling for Volume */
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #22d3ee;
            margin-top: -4px;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #475569;
            border-radius: 2px;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@19.3.0",
            "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime",
            "react-dom/client": "https://esm.sh/react-dom@19.3.0/client?deps=react@19.3.0",
            "lucide-react": "https://esm.sh/lucide-react@1.52.0?deps=react@19.3.0"
        }
    }
    </script>
    <!-- Pinned: Babel 8 compiles JSX to react/jsx-runtime imports (and changed other defaults). Babel 7 is what this app was written against. -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        
        import { 
            Shield, Users, Zap, Skull, Eye, EyeOff, FileText, Radio, AlertTriangle, 
            Ghost, Settings, CheckCircle, XCircle, Lock, Unlock, UserX, Gift,
            UserPlus, Trash2, Key, Upload, Download, FileDown, Library, Play, Pause,
            Save, HelpCircle, ExternalLink, Lock as LockIcon, Unlock as UnlockIcon,
            MousePointerClick, Sliders, Edit, PlusCircle, Volume2, VolumeX,
            Repeat, Shuffle, Music, Star, UploadCloud, Timer, Monitor
        } from 'lucide-react';

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            onAuthStateChanged,
            signInWithCustomToken
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, collection, doc, setDoc, addDoc, updateDoc, 
            onSnapshot, increment, getDoc, getDocs, writeBatch, serverTimestamp, 
            deleteDoc, deleteField, runTransaction, query, orderBy, limit
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyCPLhpAjOdIprqqcLXX5QvO785iteHyRuM", 
            authDomain: "among-ed.firebaseapp.com",
            projectId: "among-ed",
            storageBucket: "among-ed.firebasestorage.app",
            messagingSenderId: "928438234140",
            appId: "1:928438234140:web:7d3411f93381b2c5b743d9"
        };

        // --- MULTIVERSE CONFIGURATION ---
        const CLASS_LIST = ['2T', '2W', '3L', '3M', '4C', '4S', '5L', '5M', '5W', '6D', '6H', '6J'];
        const GAME_ID = 'main_game_room'; 

        // Helper to generate database paths based on the selected class
        const getPaths = (classId) => {
            const root = ['artifacts', `class-${classId}`, 'public', 'data'];
            return {
                games: [...root, 'games'],
                roster: [...root, 'roster'],
                questionSets: [...root, 'question_sets'],
                music: [...root, 'music_library']
            };
        };

        // Default Dark Ambient Space Track
        const DEFAULT_TRACK = {
            id: 'default_ambient',
            name: 'Night Detective (Default)',
            url: 'https://cdn.jsdelivr.net/gh/dmartinez-375/among-ed@main/music/night-detective-226857.mp3',
            isDefault: true
        };

        // Raw file cap for uploaded music. Base64 adds ~33%, and Firestore docs max out at 1 MiB.
        const MAX_MUSIC_BYTES = 700 * 1000;

        const BTN_COLORS = [
            "bg-blue-600 hover:bg-blue-500",
            "bg-emerald-600 hover:bg-emerald-500",
            "bg-purple-600 hover:bg-purple-500",
            "bg-orange-600 hover:bg-orange-500"
        ];

        const DEFAULT_QUESTIONS = [
            { q: "What is the capital of France?", a: ["Paris", "London", "Berlin", "Rome"], correct: 0 },
            { q: "What is 5 + 7?", a: ["10", "11", "12", "13"], correct: 2 },
            { q: "Which planet is known as the Red Planet?", a: ["Venus", "Mars", "Jupiter", "Saturn"], correct: 1 },
        ];

        const DEFAULT_COSTS = {
            peek: 7, private: 7, public: 15, emergency: 10,
            remove: 10, fake: 6, unclear: 15, disguise: 15
        };

        const CSV_TEMPLATE = `"Among Ed Import",,,,,
Question,Answer 1,Answer 2,Answer 3,Answer 4,Correct Index (1-4)
"What is the capital of France?",Paris,London,Berlin,Rome,1`;

        // --- Helpers ---
        // IMPORTANT: These require 'paths' object to be passed in
        const getGameRef = (db, paths) => doc(db, ...paths.games, GAME_ID);
        const getPlayerRef = (db, paths, uid) => doc(db, ...paths.games, GAME_ID, 'players', uid);
        const getRosterRef = (db, paths, name) => doc(db, ...paths.roster, name.toLowerCase().trim());

        // COST FIX: fast-changing counters (energy/correct/incorrect/notes) live in games/{id}/stats/{uid},
        // separate from players/{uid}. Answering a question therefore only notifies the student's own
        // listener (plus the teacher's), instead of every student listening to the players collection.
        const getStatsRef = (db, paths, uid) => doc(db, ...paths.games, GAME_ID, 'stats', uid);
        const ZERO_STATS = { energy: 0, correct: 0, incorrect: 0, notes: '' };

        // COST FIX: public feed is capped to the latest entries
        const FEED_LIMIT = 30;

        // PRESENCE: students ping stats/{uid}.lastSeen while their tab is visible. Anyone not seen
        // within PRESENCE_SECONDS is treated as absent by the teacher dashboard.
        const HEARTBEAT_MS = 45 * 1000;
        const PRESENCE_SECONDS = 150;
        const feedQuery = (db, paths) => query(
            collection(db, ...paths.games, GAME_ID, 'feed'),
            orderBy('timestamp', 'desc'),
            limit(FEED_LIMIT)
        );

        // Pending serverTimestamp() writes have no seconds yet; treat them as "now" so sorting never yields NaN.
        const feedTs = (f) => f.timestamp?.seconds ?? Date.now() / 1000;
        const sortFeed = (arr) => arr.sort((a, b) => feedTs(b) - feedTs(a));

        // Firestore batches are capped at 500 operations; run big jobs in chunks.
        const runBatched = async (db, ops) => {
            for (let i = 0; i < ops.length; i += 400) {
                const b = writeBatch(db);
                ops.slice(i, i + 400).forEach(fn => fn(b));
                await b.commit();
            }
        };

        const toInt = (v, fallback, min = 0) => (Number.isInteger(v) && v >= min ? v : fallback);

        const parseCSV = (text) => {
            const rows = [];
            let row = [];
            let col = "";
            let inQuote = false;
            
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                const next = text[i+1];
                
                if (c === '"') {
                    if (inQuote && next === '"') {
                        col += '"';
                        i++; 
                    } else {
                        inQuote = !inQuote;
                    }
                } else if (c === ',' && !inQuote) {
                    row.push(col.trim());
                    col = "";
                } else if ((c === '\r' || c === '\n') && !inQuote) {
                    if (col || row.length > 0) row.push(col.trim());
                    if (row.length > 0) rows.push(row);
                    row = [];
                    col = "";
                    if (c === '\r' && next === '\n') i++;
                } else {
                    col += c;
                }
            }
            if (col || row.length > 0) {
                row.push(col.trim());
                rows.push(row);
            }
            return rows;
        };

        function NumField({ value, onChange }) {
            return (
                <input
                    type="number"
                    className="w-16 bg-slate-800 p-1 rounded"
                    value={Number.isFinite(value) ? value : ''}
                    onChange={e => {
                        const v = parseInt(e.target.value, 10);
                        onChange(Number.isNaN(v) ? '' : v);
                    }}
                />
            );
        }

        // --- Main App ---
        function App() {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState('student'); 
            const [classId, setClassId] = useState(null); // Tracks selected class
            const [name, setName] = useState('');
            const [password, setPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [joined, setJoined] = useState(false);
            const [auth, setAuth] = useState(null);
            const [db, setDb] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');
            const [loginTab, setLoginTab] = useState('student');

            // Initialize Firebase on Mount
            useEffect(() => {
                const app = initializeApp(firebaseConfig);
                const authInst = getAuth(app);
                const dbInst = getFirestore(app);
                setAuth(authInst);
                setDb(dbInst);
                signInAnonymously(authInst);
                
                // Check URL params for Projector Mode OR a specific class link
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('mode') === 'feed') {
                    setRole('projector');
                    // If URL has ?class=2T, auto-select it.
                    if (urlParams.get('class')) {
                        setClassId(urlParams.get('class'));
                    }
                }

                return onAuthStateChanged(authInst, setUser);
            }, []);

            const handleLogin = async () => {
                if (!classId) return setErrorMsg("Please select a class first.");
                if (!name && loginTab === 'student') return setErrorMsg("Name required");
                if (!password) return setErrorMsg("Password required");
                
                // Generate paths for the selected class
                const paths = getPaths(classId);

                try {
                    if (loginTab === 'teacher') {
                        const snap = await getDoc(getGameRef(db, paths));
                        const serverPass = snap.exists() ? (snap.data().teacherPassword || 'admin') : 'admin';
                        if (password === serverPass) { setRole('teacher'); setJoined(true); }
                        else setErrorMsg("Invalid Command Code");
                    } else {
                        const pid = name.toLowerCase().trim();

                        // FIX #2: The lock only blocks NEW cadets. Anyone who already has a
                        // player doc (refresh, dropped connection) can always get back in.
                        const [gameSnap, existingPlayer] = await Promise.all([
                            getDoc(getGameRef(db, paths)),
                            getDoc(getPlayerRef(db, paths, pid))
                        ]);
                        if (gameSnap.exists() && gameSnap.data().isLocked && !existingPlayer.exists()) {
                            return setErrorMsg("Game is locked. No new cadets.");
                        }

                        const snap = await getDoc(getRosterRef(db, paths, name));
                        if (!snap.exists()) setErrorMsg("Cadet not found.");
                        else if (snap.data().password === password) { setRole('student'); setJoined(true); }
                        else setErrorMsg("Access Denied");
                    }
                } catch (e) { setErrorMsg("Error: " + e.message); }
            };

            if (!user) return <div className="min-h-screen bg-slate-950 flex items-center justify-center text-white">Initializing Comms...</div>;

            // LANDING SCREEN: If no class selected, show class picker
            if (!classId) {
                return (
                    <div className="min-h-screen bg-slate-950 text-white p-8 flex flex-col items-center justify-center">
                        <h1 className="text-4xl font-bold text-cyan-400 mb-2 flex items-center gap-3"><Radio size={40}/> Among Ed</h1>
                        <p className="text-slate-400 mb-8">Select your Mission Sector (Class)</p>
                        
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 w-full max-w-4xl">
                            {CLASS_LIST.map(cls => (
                                <button 
                                    key={cls} 
                                    onClick={() => setClassId(cls)}
                                    className="bg-slate-800 hover:bg-cyan-900/50 border border-slate-700 hover:border-cyan-500 p-6 rounded-xl transition-all group"
                                >
                                    <div className="text-2xl font-bold text-white group-hover:text-cyan-400">{cls}</div>
                                </button>
                            ))}
                        </div>

                        <div className="mt-12 pt-8 border-t border-slate-800 w-full max-w-md text-center">
                            <button onClick={() => { setRole('projector'); }} className="text-slate-500 hover:text-white flex items-center justify-center gap-2 w-full">
                                <Monitor size={16} /> Launch Projector View
                            </button>
                        </div>
                    </div>
                );
            }

            // If role is projector (either from URL or clicked on landing)
            if (role === 'projector') return <ProjectorView db={db} classId={classId} />;

            // LOGIN SCREEN
            if (!joined) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-slate-800 p-8 rounded-xl shadow-2xl max-w-md w-full border border-slate-700 relative">
                            <button onClick={() => setClassId(null)} className="absolute top-4 left-4 text-slate-500 hover:text-white text-xs flex items-center gap-1">← Back</button>
                            
                            <h1 className="text-3xl font-bold text-cyan-400 mb-2 text-center flex items-center justify-center gap-2 mt-4">
                                <Radio className="w-8 h-8" /> Among Ed
                            </h1>
                            <div className="text-center text-slate-400 mb-6 font-mono text-sm bg-slate-900/50 py-1 rounded">Sector: {classId}</div>

                            <div className="flex mb-6 bg-slate-900 rounded p-1">
                                <button onClick={() => setLoginTab('student')} className={`flex-1 py-2 rounded text-sm font-bold ${loginTab==='student'?'bg-cyan-600 text-white':'text-slate-400'}`}>Cadet</button>
                                <button onClick={() => setLoginTab('teacher')} className={`flex-1 py-2 rounded text-sm font-bold ${loginTab==='teacher'?'bg-slate-700 text-white':'text-slate-400'}`}>Teacher</button>
                            </div>
                            <div className="space-y-4">
                                {loginTab === 'student' && <input className="w-full p-3 rounded bg-slate-900 text-white border border-slate-600" placeholder="Cadet Name" value={name} onChange={e=>setName(e.target.value)} />}
                                <div className="relative">
                                    <input 
                                        className="w-full p-3 rounded bg-slate-900 text-white border border-slate-600 pr-10" 
                                        type={showPassword ? "text" : "password"} 
                                        placeholder={loginTab==='teacher'?'Command Code':'Password'} 
                                        value={password} 
                                        onChange={e=>setPassword(e.target.value)} 
                                    />
                                    <button 
                                        type="button"
                                        onClick={() => setShowPassword(!showPassword)}
                                        className="absolute right-3 top-3.5 text-slate-400 hover:text-slate-200"
                                    >
                                        {showPassword ? <EyeOff size={20} /> : <Eye size={20} />}
                                    </button>
                                </div>
                                {errorMsg && <div className="text-red-400 text-sm bg-red-900/20 p-2 rounded">{errorMsg}</div>}
                                <button onClick={handleLogin} className="w-full py-3 rounded-lg font-bold bg-cyan-600 hover:bg-cyan-500 text-white">Log In</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return role === 'teacher' 
                ? <TeacherDashboard user={user} db={db} classId={classId} /> 
                : <StudentInterface user={user} userName={name} db={db} classId={classId} />;
        }

        // --- Projector View (Public Feed Only) ---
        function ProjectorView({ db, classId }) {
            const [feed, setFeed] = useState([]);
            const [gameState, setGameState] = useState(null);
            const [players, setPlayers] = useState({});
            
            // Paths specific to the selected class
            const paths = useMemo(() => getPaths(classId), [classId]);

            useEffect(() => {
                const unsubFeed = onSnapshot(feedQuery(db, paths), (snap) => {
                    const f = [];
                    snap.forEach(doc => f.push({id: doc.id, ...doc.data()}));
                    setFeed(sortFeed(f));
                });
                const unsubGame = onSnapshot(getGameRef(db, paths), (snap) => {
                    if(snap.exists()) setGameState(snap.data());
                });
                const unsubP = onSnapshot(collection(db, ...paths.games, GAME_ID, 'players'), (s) => {
                    const p = {}; s.forEach(d => p[d.id] = {id:d.id, ...d.data()}); setPlayers(p);
                });
                return () => { unsubFeed(); unsubGame(); unsubP(); };
            }, [db, paths]);

            if (gameState?.winner) return <WinScreen winner={gameState.winner} players={players} />;
            if (gameState?.phase === 'Ejecting') return <EjectionSequence data={gameState.ejectionData} isPublic={true} />;

            return (
                <div className="min-h-screen bg-slate-950 text-white p-8">
                    <div className="max-w-4xl mx-auto">
                        <div className="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
                            <h1 className="text-4xl font-bold text-cyan-400 flex items-center gap-3"><Radio size={40}/> Sector {classId} Feed</h1>
                            <div className="bg-slate-800 px-6 py-3 rounded-lg border border-slate-600 text-center">
                                <div className="text-xs text-slate-400 uppercase tracking-widest">Investigations Remaining</div>
                                <div className="text-3xl font-mono text-white font-bold">{gameState?.config?.investigationsLeft ?? '-'}</div>
                            </div>
                        </div>
                        <div className="space-y-4">
                            {feed.map(f => (
                                <div key={f.id} className="text-2xl p-6 bg-slate-900 rounded-xl border-l-4 border-cyan-500 shadow-lg animate-fade-in">
                                    <div className="flex justify-between items-center mb-2">
                                        <span className="text-cyan-400 font-bold uppercase tracking-wider text-sm opacity-75">{f.source}</span>
                                        <span className="text-sm text-slate-500 font-mono">
                                            {f.timestamp?.seconds ? new Date(f.timestamp.seconds * 1000).toLocaleTimeString() : ''}
                                        </span>
                                    </div>
                                    <div className="text-slate-200">{f.message}</div>
                                </div>
                            ))}
                            {feed.length === 0 && <div className="text-center text-slate-600 text-xl italic mt-20">Waiting for incoming transmissions...</div>}
                        </div>
                    </div>
                </div>
            );
        }

        // --- Screens & Animations ---
        function WinScreen({ winner, players, onDismiss }) {
            const isImp = winner === 'Imposters';
            const imposterNames = Object.values(players || {})
                .filter(p => p.role === 'Imposter')
                .map(p => p.name)
                .join(", ");

            return (
                <div className={`fixed inset-0 z-50 flex flex-col items-center justify-center bg-black text-center ${isImp ? 'text-red-500' : 'text-cyan-400'}`}>
                    <h1 className="text-6xl md:text-9xl font-black uppercase tracking-widest animate-pulse mb-8">{winner} Win!</h1>
                    {isImp ? <Skull size={128} className="mb-8 mx-auto"/> : <Shield size={128} className="mb-8 mx-auto"/>}
                    {isImp && (
                        <div className="text-2xl text-white mt-4">
                            <span className="text-slate-400">The Imposters were:</span>
                            <div className="font-bold mt-2 text-red-500 text-4xl">{imposterNames}</div>
                        </div>
                    )}
                    {onDismiss && (
                        <button onClick={onDismiss} className="mt-12 bg-slate-700 hover:bg-slate-600 text-white px-6 py-3 rounded-full font-bold text-base">
                            Back to Mission Control
                        </button>
                    )}
                </div>
            );
        }

        function EjectionSequence({ data, isPublic, onResume, isTeacher }) {
            const [stage, setStage] = useState(0); 
            const [canResume, setCanResume] = useState(false);

            useEffect(() => {
                const t1 = setTimeout(() => setStage(1), 3000);
                const t2 = setTimeout(() => setStage(2), 7000);
                const t3 = setTimeout(() => {
                    setStage(3);
                    setTimeout(() => setCanResume(true), 5000); 
                }, 8500);
                return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
            }, []);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black overflow-hidden text-white cursor-default" onClick={isTeacher && canResume ? onResume : undefined}>
                    <div className="absolute inset-0 opacity-50 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] animate-pulse pointer-events-none"></div>
                    
                    {stage === 0 && (
                        <div className="text-center">
                            <h1 className="text-6xl font-black uppercase tracking-widest animate-pulse">The votes are in...</h1>
                        </div>
                    )}

                    {stage === 1 && (
                        <div className="text-center relative z-10">
                            <h1 className="text-6xl md:text-8xl font-black text-red-500 uppercase tracking-tighter drama-text">{data.name}</h1>
                            <h2 className="text-4xl mt-4 uppercase">Was Voted Out!</h2>
                            <Ghost className="w-32 h-32 mx-auto mt-8 animate-bounce text-slate-500" />
                        </div>
                    )}

                    {stage === 2 && <div className="absolute inset-0 bg-black z-50"></div>}

                    {stage === 3 && (
                        <div className="text-center relative z-10 fade-in">
                            <h2 className="text-3xl text-slate-400 mb-4">{data.name} was...</h2>
                            <h1 className={`text-6xl md:text-9xl font-black uppercase ${data.role === 'Imposter' ? 'text-red-600' : 'text-cyan-500'}`}>
                                A {data.role}!
                            </h1>
                            <div className="mt-12 text-slate-500 animate-pulse flex items-center justify-center gap-2">
                                {isTeacher ? (
                                    canResume ? (
                                        <button onClick={onResume} className="bg-slate-700 text-white px-6 py-3 rounded-full font-bold hover:bg-slate-600 transition-colors flex items-center gap-2">
                                            <MousePointerClick size={20} /> Click to Resume Game
                                        </button>
                                    ) : (
                                        <span className="text-sm opacity-50">Wait for signal...</span>
                                    )
                                ) : (
                                    <span className="text-xl">Waiting for Teacher to continue...</span>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function IntroSequence({ role, onClose }) {
            const [count, setCount] = useState(3);
            const [showRole, setShowRole] = useState(false);

            useEffect(() => {
                if (count > 0) {
                    const t = setTimeout(() => setCount(c => c - 1), 1000);
                    return () => clearTimeout(t);
                } else {
                    setShowRole(true);
                }
            }, [count]);

            return (
                <div className="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center" onClick={() => showRole && onClose()}>
                    {count > 0 ? (
                        <div className="text-9xl font-black text-white animate-ping">{count}</div>
                    ) : (
                        <div className="text-center animate-fade-in cursor-pointer p-10 bg-slate-900 border-2 border-slate-700 rounded-2xl shadow-2xl">
                            <p className="text-slate-400 uppercase tracking-widest mb-4">Your assignment</p>
                            <h1 className={`text-6xl font-black uppercase mb-8 ${role === 'Imposter' ? 'text-red-500' : 'text-cyan-400'}`}>
                                {role}
                            </h1>
                            <p className="text-sm text-slate-500 animate-pulse">(Click anywhere to begin)</p>
                        </div>
                    )}
                </div>
            );
        }

        // --- Teacher Dashboard ---
        function TeacherDashboard({ user, db, classId }) {
            const [gameState, setGameState] = useState(null);
            const [players, setPlayers] = useState({});
            const [stats, setStats] = useState({}); // { [uid]: {energy, correct, incorrect, notes, lastSeen} }

            // --- PRESENCE ---
            const [nowSec, setNowSec] = useState(() => Date.now() / 1000);
            const [clockOffset, setClockOffset] = useState(0); // server time - this device's time, in ms
            const clockOffsetSetRef = useRef(false);
            const probeNonceRef = useRef(Math.random().toString(36).slice(2));
            const isPresent = (pid) => {
                const ls = stats[pid]?.lastSeen?.seconds;
                return !!ls && (nowSec + clockOffset / 1000) - ls < PRESENCE_SECONDS;
            };
            const [config, setConfig] = useState({ 
                imposterCount: 1, meetingsEnabled: true, invRatio: 5, removeAmount: 10, meetingCooldown: 120, costs: DEFAULT_COSTS 
            });
            // FIX #4: only pull config from Firestore once, so later game-doc writes
            // (like toggling the lock) don't wipe the teacher's unsaved edits.
            const configLoadedRef = useRef(false);
            const [showStats, setShowStats] = useState(false);
            const [view, setView] = useState('game'); 
            const [winDismissed, setWinDismissed] = useState(false);
            
            // --- MUSIC PLAYER STATE ---
            const [musicLibrary, setMusicLibrary] = useState([DEFAULT_TRACK]);
            const [currentTrack, setCurrentTrack] = useState(DEFAULT_TRACK);
            const [isPlaying, setIsPlaying] = useState(false);
            const [isLooping, setIsLooping] = useState(true);
            const [isShuffling, setIsShuffling] = useState(false);
            const [volume, setVolume] = useState(0.4);
            const [isMuted, setIsMuted] = useState(false);
            const [showMusicManager, setShowMusicManager] = useState(false);
            const audioRef = useRef(null);

            // FIX #5/#6: refs so the one-time 'ended' listener and the Firestore listener always see fresh state
            const musicLibraryRef = useRef(musicLibrary);
            const isShufflingRef = useRef(isShuffling);
            const isPlayingRef = useRef(isPlaying);
            const loadedTrackIdRef = useRef(null);
            const userPickedTrackRef = useRef(false);
            useEffect(() => { musicLibraryRef.current = musicLibrary; }, [musicLibrary]);
            useEffect(() => { isShufflingRef.current = isShuffling; }, [isShuffling]);
            useEffect(() => { isPlayingRef.current = isPlaying; }, [isPlaying]);
            
            // Music Upload/Edit State
            const [uploadName, setUploadName] = useState('');
            const [uploadUrl, setUploadUrl] = useState('');
            const fileInputRefMusic = useRef(null);

            // Roster State
            const [roster, setRoster] = useState([]);
            const [newStudentName, setNewStudentName] = useState('');
            const [newStudentPass, setNewStudentPass] = useState('');
            const [newTeacherPass, setNewTeacherPass] = useState('');

            // Library State
            const [libraryOpen, setLibraryOpen] = useState(false);
            const [questionSets, setQuestionSets] = useState([]);
            const [importMode, setImportMode] = useState(false);
            const [newSetName, setNewSetName] = useState('');
            const fileInputRef = useRef(null);

            const [feed, setFeed] = useState([]);
            const [showCostEditor, setShowCostEditor] = useState(false);
            const [showQuestionEditor, setShowQuestionEditor] = useState(false);
            const [localQuestions, setLocalQuestions] = useState([]);

            // Guards endMeeting so auto-end + force-end can't both run
            const endingRef = useRef(false);

            // Paths specific to the selected class
            const paths = useMemo(() => getPaths(classId), [classId]);

            // --- PRESENCE: clock probe + re-evaluation tick ---
            useEffect(() => {
                // Server-timestamp probe so presence doesn't depend on this device's clock being right
                setDoc(getStatsRef(db, paths, '__teacher'), { probe: serverTimestamp(), nonce: probeNonceRef.current }).catch(() => {});
            }, [db, paths]);

            useEffect(() => {
                const id = setInterval(() => setNowSec(Date.now() / 1000), 10000);
                return () => clearInterval(id);
            }, []);

            // --- AUDIO LOGIC ---
            useEffect(() => {
                const audio = new Audio();
                audio.volume = volume;
                audio.loop = isLooping;
                audioRef.current = audio;

                // Only fires when loop is off (audio.loop suppresses 'ended')
                const onEnded = () => {
                    const lib = musicLibraryRef.current;
                    if (isShufflingRef.current && lib.length > 0) {
                        const next = lib[Math.floor(Math.random() * lib.length)];
                        if (next.id === loadedTrackIdRef.current) {
                            audio.currentTime = 0;
                            audio.play().catch(() => {});
                        } else {
                            setCurrentTrack(next);
                        }
                    } else {
                        setIsPlaying(false);
                    }
                };
                audio.addEventListener('ended', onEnded);

                return () => {
                    audio.pause();
                    audio.removeEventListener('ended', onEnded);
                    audioRef.current = null;
                };
            }, []);

            // Loop toggle
            useEffect(() => {
                if (audioRef.current) audioRef.current.loop = isLooping;
            }, [isLooping]);

            // Handle Volume / Mute
            useEffect(() => {
                if(audioRef.current) audioRef.current.volume = isMuted ? 0 : volume;
            }, [volume, isMuted]);

            // Handle Track Changes / Play State
            useEffect(() => {
                const a = audioRef.current;
                if (!a) return;

                if (currentTrack.url && loadedTrackIdRef.current !== currentTrack.id) {
                    a.src = currentTrack.url;
                    loadedTrackIdRef.current = currentTrack.id;
                    a.load();
                }
                if (isPlaying) {
                    const playPromise = a.play();
                    if (playPromise) playPromise.catch(e => console.log("Play interrupted or waiting for interaction", e));
                } else {
                    a.pause();
                }
            }, [currentTrack, isPlaying]);

            const togglePlay = () => setIsPlaying(!isPlaying);

            const pickTrack = (track) => {
                userPickedTrackRef.current = true;
                setCurrentTrack(track);
            };

            // Music Library Persistence
            useEffect(() => {
                const unsubMusic = onSnapshot(collection(db, ...paths.music), (snap) => {
                    const custom = [];
                    snap.forEach(d => custom.push({ id: d.id, ...d.data() }));

                    // The built-in track is the default unless a custom track is starred
                    const hasCustomDefault = custom.some(t => t.isDefault);
                    const tracks = [{ ...DEFAULT_TRACK, isDefault: !hasCustomDefault }, ...custom];
                    setMusicLibrary(tracks);

                    // Apply the saved default until the teacher picks something themselves
                    if (!userPickedTrackRef.current && !isPlayingRef.current) {
                        const def = tracks.find(t => t.isDefault) || tracks[0];
                        setCurrentTrack(prev => (prev.id === def.id ? prev : def));
                    }
                });
                return () => unsubMusic();
            }, [db, paths]);

            const handleMusicUpload = (e) => {
                const input = e.target;
                const file = input.files[0];
                if (!file) return;
                if (!uploadName.trim()) { alert("Enter a track name first."); input.value = ''; return; }
                if (file.size > MAX_MUSIC_BYTES) {
                    alert("File too large for this database (limit ~700KB). Please use a URL for longer tracks.");
                    input.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        await addDoc(collection(db, ...paths.music), {
                            name: uploadName.trim(),
                            url: evt.target.result,
                            isDefault: false,
                            createdAt: serverTimestamp()
                        });
                        setUploadName('');
                    } catch (err) {
                        alert("Upload failed: " + err.message);
                    } finally {
                        if (fileInputRefMusic.current) fileInputRefMusic.current.value = '';
                    }
                };
                reader.onerror = () => alert("Could not read that file.");
                reader.readAsDataURL(file);
            };

            const handleUrlAdd = async () => {
                if (!uploadUrl || !uploadName) return alert("Name and URL required");
                try {
                    await addDoc(collection(db, ...paths.music), {
                        name: uploadName,
                        url: uploadUrl,
                        isDefault: false,
                        createdAt: serverTimestamp()
                    });
                    setUploadName('');
                    setUploadUrl('');
                } catch (err) {
                    alert("Could not add track: " + err.message);
                }
            }

            const deleteTrack = async (id) => {
                if(id === 'default_ambient') return alert("Cannot delete system default.");
                if(confirm("Delete this track?")) {
                    await deleteDoc(doc(db, ...paths.music, id));
                }
            };

            const setTrackAsDefault = async (targetId) => {
                const batch = writeBatch(db);
                musicLibrary.forEach(t => {
                    if (t.id !== 'default_ambient') {
                        batch.update(doc(db, ...paths.music, t.id), { isDefault: t.id === targetId });
                    }
                });
                await batch.commit();
                alert("Default track updated. It will load automatically next time.");
            };

            // --- END AUDIO LOGIC ---

            useEffect(() => {
                const unsubGame = onSnapshot(getGameRef(db, paths), (snap) => {
                    if (snap.exists()) {
                        setGameState(snap.data());
                        const c = snap.data().config;
                        if (c && !configLoadedRef.current) {
                            configLoadedRef.current = true;
                            setConfig(prev => ({ ...prev, ...c, costs: { ...DEFAULT_COSTS, ...(c.costs || {}) } }));
                        }
                    } else {
                        setDoc(getGameRef(db, paths), {
                            status: 'Lobby', phase: 'Lobby',
                            config: { imposterCount: 1, meetingsEnabled: true, invRatio: 5, removeAmount: 10, meetingCooldown: 120, costs: DEFAULT_COSTS },
                            teacherPassword: 'admin', questions: DEFAULT_QUESTIONS, isLocked: false, skipVotes: 0
                        });
                    }
                });
                const unsubPlayers = onSnapshot(collection(db, ...paths.games, GAME_ID, 'players'), (s) => {
                    const p = {}; s.forEach(d => p[d.id] = {id:d.id, ...d.data()}); setPlayers(p);
                });
                const unsubStats = onSnapshot(collection(db, ...paths.games, GAME_ID, 'stats'), (s) => {
                    const m = {};
                    s.forEach(d => {
                        const x = d.data();
                        m[d.id] = x;
                        if (d.id === '__teacher' && !clockOffsetSetRef.current && x.nonce === probeNonceRef.current
                            && x.probe?.seconds && !d.metadata.hasPendingWrites) {
                            clockOffsetSetRef.current = true;
                            setClockOffset(x.probe.seconds * 1000 - Date.now());
                        }
                    });
                    setStats(m);
                });
                const unsubQS = onSnapshot(collection(db, ...paths.questionSets), (snap) => {
                    const qs = [];
                    snap.forEach(doc => qs.push({id: doc.id, ...doc.data()}));
                    qs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                    setQuestionSets(qs);
                });
                const unsubRoster = onSnapshot(collection(db, ...paths.roster), (snap) => {
                    const r = [];
                    snap.forEach(doc => r.push({id: doc.id, ...doc.data()}));
                    setRoster(r);
                });
                
                const unsubFeed = onSnapshot(feedQuery(db, paths), (snap) => {
                    const f = [];
                    snap.forEach(doc => f.push({id: doc.id, ...doc.data()}));
                    setFeed(sortFeed(f));
                });

                return () => { unsubGame(); unsubPlayers(); unsubStats(); unsubQS(); unsubRoster(); unsubFeed(); };
            }, [db, paths]);

            // Sync Local Questions when Editor opens
            useEffect(() => {
                if (showQuestionEditor && gameState?.questions) {
                    setLocalQuestions(JSON.parse(JSON.stringify(gameState.questions)));
                }
            }, [showQuestionEditor]);

            // Re-arm the end-meeting guard once the meeting phase is over
            useEffect(() => {
                if (gameState?.phase !== 'Meeting') endingRef.current = false;
            }, [gameState?.phase]);

            // Let the teacher see the win screen again after a new winner is declared / game resets
            useEffect(() => {
                if (!gameState?.winner) setWinDismissed(false);
            }, [gameState?.winner]);

            // Auto-End Voting Logic
            useEffect(() => {
                if (gameState?.phase === 'Meeting') {
                    // Absent players (closed tab / lost connection) don't hold up the vote; anyone who voted still counts.
                    const eligible = Object.values(players).filter(p => p.isAlive && (p.hasVoted || isPresent(p.id)));
                    const votedCount = eligible.filter(p => p.hasVoted).length;
                    if (eligible.length > 0 && votedCount === eligible.length) {
                        endMeeting(); 
                    }
                }
            }, [players, stats, nowSec, clockOffset, gameState?.phase]);

            const startGame = async () => {
                const allIds = Object.keys(players);
                const pIds = allIds.filter(isPresent);
                const absentIds = allIds.filter(id => !isPresent(id));
                if (pIds.length < 3) {
                    return alert(`Need 3+ cadets online (${pIds.length} seen in the last ${PRESENCE_SECONDS / 60} minutes). If students are logged in, ask them to reload the page.`);
                }
                if (absentIds.length) {
                    const names = absentIds.map(id => players[id]?.name || id).join(', ');
                    if (!confirm(`${absentIds.length} cadet(s) haven't been seen in the last ${PRESENCE_SECONDS / 60} minutes:\n\n${names}\n\nStart without them? They'll be removed from this round. (If you unlock the game later, they can rejoin as Crewmates.)`)) return;
                }

                // FIX #4: sanitize number inputs (empty box / NaN would otherwise break slice())
                const maxImps = Math.max(1, Math.floor((pIds.length - 1) / 2));
                const impCount = Math.min(maxImps, toInt(config.imposterCount, 1, 1));
                if (impCount !== config.imposterCount) alert(`Imposter count adjusted to ${impCount} for ${pIds.length} players.`);
                const invRatio = toInt(config.invRatio, 5, 1);
                const removeAmount = toInt(config.removeAmount, 10, 0);
                const meetingCooldown = toInt(config.meetingCooldown, 120, 0);
                
                const imposters = [...pIds].sort(()=>0.5-Math.random()).slice(0, impCount);
                const batch = writeBatch(db);

                absentIds.forEach(id => {
                    batch.delete(getPlayerRef(db, paths, id));
                    batch.delete(getStatsRef(db, paths, id));
                });
                
                pIds.forEach(pid => {
                    batch.update(getPlayerRef(db, paths, pid), {
                        role: imposters.includes(pid) ? 'Imposter' : 'Crewmate',
                        isAlive: true, investigatedStatus: 'Normal',
                        votes: 0, hasVoted: false
                    });
                    batch.set(getStatsRef(db, paths, pid), ZERO_STATS);
                });

                batch.set(getGameRef(db, paths), {
                    status: 'Active', phase: 'Game', startTime: serverTimestamp(),
                    config: {
                        ...config,
                        imposterCount: impCount, invRatio, removeAmount, meetingCooldown,
                        investigationsLeft: Math.floor(pIds.length * invRatio)
                    },
                    ejectionData: deleteField(), winner: deleteField(),
                    isLocked: true, lastMeetingEnded: deleteField(), skipVotes: 0
                }, { merge: true });

                // Start Game Feed Message
                const feedRef = collection(db, ...paths.games, GAME_ID, 'feed');
                batch.set(doc(feedRef), {
                    message: "🚀 MISSION STARTED! Good luck crew.",
                    source: "System",
                    timestamp: serverTimestamp()
                });

                await batch.commit();
            };

            // Ejects a player and starts the ejection sequence. The win check now happens
            // in resumeGame, AFTER the reveal, instead of on a fragile 9s timer in this tab.
            const handleEject = async (playerId) => {
                const p = players[playerId];
                if (!p) return;
                
                const batch = writeBatch(db);
                batch.update(getGameRef(db, paths), { phase: 'Ejecting', ejectionData: { name: p.name, role: p.role } });
                batch.update(getPlayerRef(db, paths, playerId), { isAlive: false });
                
                const feedRef = collection(db, ...paths.games, GAME_ID, 'feed');
                batch.set(doc(feedRef), {
                    message: `${p.name} was voted out. They were a ${p.role}.`,
                    source: "System",
                    timestamp: serverTimestamp()
                });

                await batch.commit();
            };

            // FIX #3: Teacher clicks "Resume" after the role reveal -> check for a winner now.
            const resumeGame = async () => {
                const alive = Object.values(players).filter(pl => pl.isAlive);
                const aliveImposters = alive.filter(pl => pl.role === 'Imposter').length;
                const imposterNames = Object.values(players).filter(pl => pl.role === 'Imposter').map(i => i.name).join(', ');

                let winner = null;
                if (aliveImposters === 0) winner = 'Crewmates';
                else if (alive.length <= 2) winner = 'Imposters';

                if (winner) {
                    await updateDoc(getGameRef(db, paths), { winner, phase: 'GameOver', ejectionData: deleteField() });
                    await addDoc(collection(db, ...paths.games, GAME_ID, 'feed'), {
                        message: winner === 'Crewmates'
                            ? "GAME OVER: Crewmates Win! All Imposters eliminated."
                            : `GAME OVER: Imposters Win! The Imposters were: ${imposterNames}`,
                        source: "System",
                        timestamp: serverTimestamp()
                    });
                } else {
                    await updateDoc(getGameRef(db, paths), { phase: 'Game', ejectionData: deleteField() });
                }
            }

            // FIX #1: skip votes are tallied on the game doc and compared against the top player
            const endMeeting = async () => {
                if (endingRef.current) return;
                endingRef.current = true;
                try {
                    const alive = Object.values(players).filter(p => p.isAlive);
                    const skipVotes = gameState?.skipVotes || 0;

                    let maxVotes = 0;
                    let leaders = [];
                    alive.forEach(p => {
                        const v = p.votes || 0;
                        if (v > maxVotes) { maxVotes = v; leaders = [p]; }
                        else if (v === maxVotes && v > 0) leaders.push(p);
                    });

                    const ops = Object.keys(players).map(pid => (b) => b.update(getPlayerRef(db, paths, pid), { votes: 0, hasVoted: false }));
                    ops.push((b) => b.update(getGameRef(db, paths), { lastMeetingEnded: serverTimestamp(), skipVotes: 0 }));
                    await runBatched(db, ops);

                    if (leaders.length === 1 && maxVotes > skipVotes) {
                        await handleEject(leaders[0].id);
                    } else {
                        const reason = (skipVotes >= maxVotes && skipVotes > 0) ? "Skip won the vote" : "Tie vote";
                        await updateDoc(getGameRef(db, paths), { phase: 'Game' });
                        await addDoc(collection(db, ...paths.games, GAME_ID, 'feed'), {
                            message: `Vote result: ${reason}. No one was ejected.`,
                            source: "System",
                            timestamp: serverTimestamp()
                        });
                    }
                } catch (err) {
                    console.error("endMeeting failed", err);
                    endingRef.current = false;
                }
            };

            const confirmReset = async () => {
                const feedSnapshot = await getDocs(collection(db, ...paths.games, GAME_ID, 'feed'));
                const ops = [];
                ops.push((b) => b.update(getGameRef(db, paths), { status: 'Lobby', phase: 'Lobby', ejectionData: deleteField(), winner: deleteField(), isLocked: false, lastMeetingEnded: deleteField(), skipVotes: 0 }));
                Object.keys(players).forEach(pid => {
                    ops.push((b) => b.update(getPlayerRef(db, paths, pid), { 
                        role:'Pending', isAlive:true, votes:0, hasVoted:false, investigatedStatus: 'Normal'
                    }));
                    ops.push((b) => b.set(getStatsRef(db, paths, pid), ZERO_STATS));
                });
                feedSnapshot.forEach((d) => ops.push((b) => b.delete(d.ref)));

                await runBatched(db, ops);
                setShowStats(false);
                setWinDismissed(false);
            };

            const removePlayer = async (id) => {
                if(confirm("Remove player?")) {
                    const b = writeBatch(db);
                    b.delete(getPlayerRef(db, paths, id));
                    b.delete(getStatsRef(db, paths, id));
                    await b.commit();
                }
            };

            const removeAllPlayers = async () => {
                if (!confirm("WARNING: This will remove ALL players from the game. This cannot be undone. Are you sure?")) return;
                const ops = [];
                Object.keys(players).forEach(pid => {
                    ops.push((b) => b.delete(getPlayerRef(db, paths, pid)));
                    ops.push((b) => b.delete(getStatsRef(db, paths, pid)));
                });
                await runBatched(db, ops);
            };

            // Drops cadets who haven't been seen recently (stale rows from earlier sessions, closed tabs)
            const removeAbsent = async () => {
                const absent = Object.values(players).filter(p => !isPresent(p.id));
                if (absent.length === 0) return alert("Everyone on the manifest has been seen recently.");
                const names = absent.map(p => p.name).join(', ');
                if (!confirm(`Remove ${absent.length} cadet(s) not seen in the last ${PRESENCE_SECONDS / 60} minutes?\n\n${names}`)) return;
                const ops = [];
                absent.forEach(p => {
                    ops.push((b) => b.delete(getPlayerRef(db, paths, p.id)));
                    ops.push((b) => b.delete(getStatsRef(db, paths, p.id)));
                });
                await runBatched(db, ops);
            };

            // Roster Actions
            const addStudent = async () => {
                if (!newStudentName || !newStudentPass) return;
                const id = newStudentName.toLowerCase().trim();
                await setDoc(getRosterRef(db, paths, id), {
                    name: newStudentName,
                    password: newStudentPass,
                    createdAt: serverTimestamp()
                });
                setNewStudentName(''); setNewStudentPass('');
            };

            const removeRosterStudent = async (id) => {
                if (confirm('Remove student from roster?')) await deleteDoc(getRosterRef(db, paths, id));
            };

            const updateTeacherPass = async () => {
                if (!newTeacherPass) return;
                await updateDoc(getGameRef(db, paths), { teacherPassword: newTeacherPass });
                alert('Password Updated');
                setNewTeacherPass('');
            };

            // Question Editor Logic
            const updateLocalQuestion = (idx, field, value, ansIdx = null) => {
                const newQs = [...localQuestions];
                if (field === 'q') newQs[idx].q = value;
                if (field === 'correct') newQs[idx].correct = value;
                if (field === 'a' && ansIdx !== null) newQs[idx].a[ansIdx] = value;
                setLocalQuestions(newQs);
            };

            const addLocalQuestion = () => {
                setLocalQuestions([...localQuestions, { q: "New Question", a: ["Opt 1", "Opt 2", "Opt 3", "Opt 4"], correct: 0 }]);
            };

            const deleteLocalQuestion = (idx) => {
                if (confirm("Delete this question?")) {
                    setLocalQuestions(localQuestions.filter((_, i) => i !== idx));
                }
            };

            const saveQuestions = async () => {
                await updateDoc(getGameRef(db, paths), { questions: localQuestions });
                setShowQuestionEditor(false);
            };

            // Library Functions
            const downloadTemplate = () => {
                const blob = new Blob([CSV_TEMPLATE], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'among_ed_import.csv'; a.click();
            };
            const loadQuestionSet = async (set) => {
                if (confirm(`Load "${set.name}"?`)) {
                    await updateDoc(getGameRef(db, paths), { questions: set.questions });
                    setLibraryOpen(false);
                }
            };
            const deleteQuestionSet = async (id) => {
                if (confirm("Delete?")) await deleteDoc(doc(db, ...paths.questionSets, id));
            };

            // FIX #8: robust CSV import
            const handleFileUpload = (e) => {
                const input = e.target;
                const file = input.files[0];
                if (!file || !newSetName.trim()) { input.value = ''; return alert("Need File & Name"); }
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const text = String(evt.target.result).replace(/^\uFEFF/, ''); // strip BOM
                    const rows = parseCSV(text);
                    const newQs = [];
                    let skipped = 0;

                    for (const r of rows) {
                        const first = (r[0] || '').trim();
                        if (!first) continue;                                     // blank row
                        if (/^among ed import$/i.test(first)) continue;           // title row
                        if (/^question$/i.test(first)) continue;                  // header row

                        const raw = [r[1], r[2], r[3], r[4]].map(a => (a || '').trim());
                        const cIdx = (r[5] === undefined || r[5] === '') ? 0 : parseInt(r[5], 10) - 1;

                        // Correct index must be 1-4 and point at a non-blank answer
                        if (!(cIdx >= 0 && cIdx < 4) || !raw[cIdx]) { skipped++; continue; }

                        // Drop blank answers but keep "correct" pointing at the right one
                        const ans = [];
                        let correct = 0;
                        raw.forEach((a, i) => {
                            if (!a) return;
                            if (i === cIdx) correct = ans.length;
                            ans.push(a);
                        });
                        if (ans.length < 2) { skipped++; continue; }

                        newQs.push({ q: first, a: ans, correct });
                    }

                    if (newQs.length) {
                        try {
                            await addDoc(collection(db, ...paths.questionSets), { name: newSetName.trim(), questions: newQs, createdAt: serverTimestamp() });
                            setImportMode(false); setNewSetName('');
                            alert(`Imported ${newQs.length} questions.` + (skipped ? ` Skipped ${skipped} invalid row(s).` : ''));
                        } catch (err) {
                            alert("Import failed: " + err.message);
                        }
                    } else {
                        alert("No valid questions found." + (skipped ? ` (${skipped} row(s) skipped - check the Correct Index column.)` : ''));
                    }
                    input.value = '';
                };
                reader.readAsText(file);
            };

            // Teacher now sees the win screen too
            if (gameState?.winner && !winDismissed) {
                return <WinScreen winner={gameState.winner} players={players} onDismiss={() => setWinDismissed(true)} />;
            }

            return (
                <div className="min-h-screen bg-slate-950 text-white p-6">
                    <div className="max-w-6xl mx-auto">
                        <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                            <h1 className="text-3xl font-bold flex gap-2"><Radio/> Mission Control ({classId})</h1>
                            
                            {/* VIEW TABS */}
                            <div className="flex bg-slate-800 rounded p-1">
                                <button onClick={() => setView('game')} className={`px-4 py-2 rounded font-bold ${view==='game' ? 'bg-slate-600 text-white' : 'text-slate-400'}`}>Game</button>
                                <button onClick={() => setView('roster')} className={`px-4 py-2 rounded font-bold ${view==='roster' ? 'bg-slate-600 text-white' : 'text-slate-400'}`}>Roster & Settings</button>
                            </div>

                            <div className="flex gap-2 items-center">
                                {/* Music Controls Widget */}
                                <div className="bg-slate-800 px-3 py-1 rounded-xl flex items-center gap-3 border border-slate-700 mr-2 shadow-lg">
                                    <button onClick={togglePlay} className={`p-2 rounded-full ${isPlaying ? 'bg-cyan-600 text-white' : 'bg-slate-700 text-cyan-400'}`}>
                                        {isPlaying ? <Pause size={16} fill="currentColor" /> : <Play size={16} fill="currentColor" />}
                                    </button>
                                    
                                    <div className="flex flex-col">
                                        <select 
                                            value={currentTrack.id} 
                                            onChange={(e) => {
                                                const track = musicLibrary.find(t => t.id === e.target.value);
                                                if(track) pickTrack(track);
                                            }}
                                            className="bg-transparent text-xs font-bold w-32 outline-none cursor-pointer"
                                        >
                                            {musicLibrary.map(t => (
                                                <option key={t.id} value={t.id} className="bg-slate-900">{t.name}</option>
                                            ))}
                                        </select>
                                        <div className="flex items-center gap-2 mt-1">
                                            <button onClick={() => setIsLooping(!isLooping)} className={`${isLooping ? 'text-green-400' : 'text-slate-500'} hover:text-white`} title="Loop current track">
                                                <Repeat size={12} />
                                            </button>
                                            <button onClick={() => setIsShuffling(!isShuffling)} className={`${isShuffling ? 'text-purple-400' : 'text-slate-500'} hover:text-white`} title="Shuffle (turn Loop off to use)">
                                                <Shuffle size={12} />
                                            </button>
                                            <div className="h-3 w-[1px] bg-slate-600 mx-1"></div>
                                            <button onClick={() => setIsMuted(!isMuted)} className="text-slate-400 hover:text-white">
                                                {isMuted ? <VolumeX size={12} /> : <Volume2 size={12} />}
                                            </button>
                                            <input 
                                                type="range" min="0" max="1" step="0.05" 
                                                value={isMuted ? 0 : volume} 
                                                onChange={(e) => {setVolume(parseFloat(e.target.value)); setIsMuted(false);}}
                                                className="w-12 h-1 bg-slate-600 rounded-lg appearance-none cursor-pointer"
                                            />
                                        </div>
                                    </div>

                                    <button onClick={() => setShowMusicManager(true)} className="p-2 text-slate-400 hover:text-white border-l border-slate-600 pl-3 ml-1">
                                        <Music size={16} />
                                    </button>
                                </div>

                                <button onClick={() => updateDoc(getGameRef(db, paths), { isLocked: !gameState?.isLocked })} className={`px-4 py-2 rounded flex gap-2 items-center ${gameState?.isLocked ? 'bg-red-600' : 'bg-green-600'}`}>
                                    {gameState?.isLocked ? <LockIcon size={16}/> : <UnlockIcon size={16}/>} {gameState?.isLocked ? 'Locked' : 'Open'}
                                </button>
                                <button onClick={() => window.open(`${window.location.pathname}?mode=feed&class=${classId}`, '_blank')} className="bg-purple-600 px-4 py-2 rounded flex gap-2 items-center"><ExternalLink size={16}/> Projector</button>
                            </div>
                        </div>

                        {view === 'roster' ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="bg-slate-900 p-6 rounded-xl border border-slate-800">
                                    <h2 className="text-xl font-bold text-cyan-400 mb-4 flex items-center gap-2"><UserPlus /> Add to Roster</h2>
                                    <div className="space-y-3">
                                        <input value={newStudentName} onChange={(e) => setNewStudentName(e.target.value)} placeholder="Student Name" className="w-full p-2 bg-slate-800 rounded border border-slate-700" />
                                        <input value={newStudentPass} onChange={(e) => setNewStudentPass(e.target.value)} placeholder="Set Password" className="w-full p-2 bg-slate-800 rounded border border-slate-700" />
                                        <button onClick={addStudent} className="w-full bg-cyan-600 hover:bg-cyan-500 py-2 rounded font-bold">Add Student</button>
                                    </div>
                                    <div className="mt-8 pt-8 border-t border-slate-800">
                                        <h2 className="text-xl font-bold text-slate-200 mb-4 flex items-center gap-2"><Key /> Teacher Settings</h2>
                                        <input value={newTeacherPass} onChange={(e) => setNewTeacherPass(e.target.value)} placeholder="New Teacher Password" className="w-full p-2 bg-slate-800 rounded border border-slate-700 mb-2" />
                                        <button onClick={updateTeacherPass} className="w-full bg-slate-700 hover:bg-slate-600 py-2 rounded font-bold">Update Password</button>
                                    </div>
                                </div>
                                <div className="bg-slate-900 p-6 rounded-xl border border-slate-800">
                                    <h2 className="text-xl font-bold text-slate-200 mb-4">Current Class ({roster.length})</h2>
                                    <div className="max-h-[500px] overflow-y-auto space-y-2 pr-2">
                                        {roster.map(s => (
                                            <div key={s.id} className="flex justify-between items-center bg-slate-800 p-3 rounded border border-slate-700">
                                                <div><div className="font-bold">{s.name}</div><div className="text-xs text-slate-400">Password: {s.password}</div></div>
                                                <button onClick={() => removeRosterStudent(s.id)} className="text-red-400 hover:text-red-300 p-2"><Trash2 size={18} /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="lg:col-span-1 space-y-6">
                                    <div className="bg-slate-900 p-6 rounded-xl border border-slate-800">
                                        {gameState?.status === 'Lobby' ? (
                                            <div className="space-y-4">
                                                <h3 className="font-bold text-cyan-400 border-b border-slate-700 pb-2">Mission Settings</h3>
                                                <div className="flex justify-between items-center"><span>Imposters:</span><NumField value={config.imposterCount} onChange={v => setConfig({...config, imposterCount: v})} /></div>
                                                <div className="flex justify-between items-center"><span>Inv. Ratio:</span><NumField value={config.invRatio} onChange={v => setConfig({...config, invRatio: v})} /></div>
                                                <div className="flex justify-between items-center"><span>Remove Amt:</span><NumField value={config.removeAmount} onChange={v => setConfig({...config, removeAmount: v})} /></div>
                                                <div className="flex justify-between items-center"><span>Meeting CD (s):</span><NumField value={config.meetingCooldown} onChange={v => setConfig({...config, meetingCooldown: v})} /></div>
                                                
                                                <div className="grid grid-cols-2 gap-2 mt-2">
                                                    <button onClick={() => setShowCostEditor(true)} className="py-2 bg-slate-700 hover:bg-slate-600 rounded font-bold text-xs flex justify-center items-center gap-1">
                                                        <Sliders size={14} /> Energy Costs
                                                    </button>
                                                    <button onClick={() => setShowQuestionEditor(true)} className="py-2 bg-slate-700 hover:bg-slate-600 rounded font-bold text-xs flex justify-center items-center gap-1">
                                                        <Edit size={14}/> Edit Questions
                                                    </button>
                                                </div>

                                                <div className="grid grid-cols-2 gap-2 mt-2">
                                                    <button onClick={() => { setLibraryOpen(true); setImportMode(false); }} className="py-2 bg-slate-700 hover:bg-slate-600 rounded font-bold flex items-center justify-center gap-2 text-xs">
                                                        <Library size={16} /> Question Library
                                                    </button>
                                                    <button onClick={startGame} className="py-2 bg-green-600 hover:bg-green-500 rounded font-bold text-xs">
                                                        START MISSION
                                                    </button>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="space-y-3">
                                                <div className="p-4 bg-slate-800 rounded border border-cyan-500/30">
                                                    <div className="text-xs text-slate-400 uppercase">Investigations Left</div>
                                                    <div className="text-3xl font-mono text-cyan-400">{gameState?.config?.investigationsLeft}</div>
                                                </div>
                                                {gameState?.phase === 'Meeting' && (
                                                    <div className="p-3 bg-slate-800 rounded border border-red-500/30 text-sm">
                                                        <span className="text-slate-400 uppercase text-xs">Skip votes: </span>
                                                        <span className="font-mono font-bold text-white">{gameState?.skipVotes || 0}</span>
                                                    </div>
                                                )}
                                                <button onClick={() => setShowStats(true)} className="w-full py-2 bg-orange-700 hover:bg-orange-600 rounded font-bold">Reset to Lobby</button>
                                            </div>
                                        )}
                                    </div>

                                    <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 h-64 overflow-y-auto">
                                            <h3 className="text-sm font-bold text-slate-400 uppercase mb-3 sticky top-0 bg-slate-900 pb-2">Public Feed</h3>
                                            <div className="space-y-2">
                                            {feed.map(f => (
                                                <div key={f.id} className="text-sm p-2 bg-slate-800 rounded border-l-2 border-cyan-500 animate-fade-in">
                                                    <div className="flex justify-between items-center mb-1">
                                                        <span className="text-cyan-300 font-bold text-xs">{f.source}</span>
                                                        <span className="text-[10px] text-slate-500 font-mono">
                                                            {f.timestamp?.seconds ? new Date(f.timestamp.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) : ''}
                                                        </span>
                                                    </div>
                                                    <span className="text-slate-200">{f.message}</span>
                                                </div>
                                            ))}
                                            {feed.length === 0 && <p className="text-slate-600 italic text-sm">No activity yet...</p>}
                                            </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-2 bg-slate-900 p-6 rounded-xl border border-slate-800">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-2xl font-bold">Crew Manifest ({Object.keys(players).length}) <span className="text-sm font-normal text-slate-400">· {Object.keys(players).filter(isPresent).length} online</span></h2>
                                        <div className="flex gap-2">
                                            <button onClick={removeAbsent} className="bg-slate-800 border border-slate-600 text-slate-200 px-3 py-2 rounded font-bold text-xs hover:bg-slate-700 transition-colors">Remove Absent</button>
                                            <button onClick={removeAllPlayers} className="bg-red-950 border border-red-800 text-red-200 px-3 py-2 rounded font-bold text-xs hover:bg-red-900 transition-colors">Remove All Crew</button>
                                            {gameState?.phase === 'Meeting' && <button onClick={endMeeting} className="bg-red-600 px-4 py-2 rounded font-bold animate-pulse">Force End Vote</button>}
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {Object.values(players).map(p => (
                                            <div key={p.id} className={`flex justify-between items-center p-3 rounded border ${p.isAlive?'bg-slate-800 border-slate-700':'bg-red-900/20 border-red-900'}`}>
                                                <div>
                                                    <div className="font-bold flex items-center gap-2">
                                                        {p.isAlive?<Users size={16} className="text-cyan-400"/>:<Skull size={16} className="text-red-500"/>}
                                                        {p.name}
                                                        <span title={isPresent(p.id) ? 'Online' : 'Not seen recently'} className={`inline-block w-2 h-2 rounded-full ${isPresent(p.id) ? 'bg-green-500' : 'bg-slate-600'}`}></span>
                                                        {gameState?.status !== 'Lobby' && <span className={`text-[10px] px-1 rounded ${p.role==='Imposter'?'bg-red-600':'bg-cyan-600'}`}>{p.role}</span>}
                                                    </div>
                                                    <div className="text-xs text-slate-400">⚡ {stats[p.id]?.energy ?? 0} | ✓ {stats[p.id]?.correct ?? 0} | Votes: {p.votes || 0}</div>
                                                </div>
                                                <button onClick={() => removePlayer(p.id)} className="text-slate-500 hover:text-red-500"><Trash2 size={16}/></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Music Manager Modal */}
                        {showMusicManager && (
                            <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-800 w-full max-w-xl rounded-xl p-6 border border-slate-700 max-h-[90vh] flex flex-col">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-2xl font-bold text-cyan-400 flex items-center gap-2"><Music size={24}/> Music Library</h2>
                                        <button onClick={() => setShowMusicManager(false)} className="bg-slate-700 px-3 py-1 rounded hover:bg-slate-600">Close</button>
                                    </div>

                                    <div className="mb-6 bg-slate-900 p-4 rounded border border-slate-700">
                                        <h3 className="font-bold text-slate-300 mb-2 text-sm uppercase">Add New Track</h3>
                                        <div className="space-y-3">
